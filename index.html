<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Scrolling Motion Graphic</title>
    <!-- GSAP for Advanced Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            overflow: hidden; 
        }

        .scroll-container {
            width: 100vw;
            height: 100dvh;
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .slide {
            position: relative;
            width: 100vw;
            height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        /* ========================================= */
        /* --- HARDWARE ASSET CACHE ---------------- */
        /* ========================================= */
        #hardware-cache {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            z-index: -9999;
        }

        /* ========================================= */
        /* --- CUSTOM LOADER OVERLAY --------------- */
        /* ========================================= */
        #loaderOverlay {
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loader-content {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 120px;
            height: 120px;
        }

        .loader-ring {
            position: absolute;
            transform: rotate(-90deg);
            transition: opacity 0.3s ease;
        }

        .progress-ring {
            stroke-dasharray: 339.29; 
            stroke-dashoffset: 339.29;
            transition: stroke-dashoffset 0.4s ease-out; 
        }

        #loader-icon {
            width: 65px;
            height: 65px;
            object-fit: contain;
            z-index: 10000;
        }

        /* ========================================= */
        /* --- GLOBAL UI LAYER (ICONS) ------------- */
        /* ========================================= */
        #ui-layer {
            position: fixed;
            inset: 0;
            z-index: 1000;
            pointer-events: none; 
        }

        .corner-icon {
            position: absolute;
            bottom: clamp(20px, 5vw, 40px);
            width: 15vw; 
            max-width: 110px; 
            pointer-events: auto; 
            cursor: pointer;
            object-fit: contain;
            transition: filter 0.1s ease; 
        }

        .corner-icon:active {
            filter: brightness(0.7); 
        }

        #b-icon {
            left: clamp(20px, 5vw, 40px);
            transform-origin: center;
            opacity: 0; 
        }

        #cd-icon {
            right: clamp(20px, 5vw, 40px);
            transform-origin: center;
        }

        /* ========================================= */
        /* --- SLIDE 1: 2D ANIMATION STYLES -------- */
        /* ========================================= */
        .brand-text {
            position: absolute;
            font-family: Impact, 'Arial Black', sans-serif;
            font-weight: 900;
            font-stretch: ultra-condensed;
            color: #ff0000;
            text-transform: uppercase;
            font-size: 13vw; 
            letter-spacing: 0.05em; 
            transform: scaleX(0.75);
            white-space: nowrap;
            user-select: none;
            z-index: 10;
            will-change: transform;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scaleX(0.75);
        }

        .car {
            position: absolute;
            height: 8vw; 
            object-fit: contain;
            z-index: 20;
            will-change: transform, left, bottom;
            display: none; 
            pointer-events: none;
        }

        .character {
            position: absolute;
            height: 12vw; 
            object-fit: contain;
            z-index: 30;
            will-change: transform, bottom, left;
            display: none; 
            pointer-events: none;
        }

        /* ========================================= */
        /* --- SLIDE 2: FAST PHOTO STICKERS -------- */
        /* ========================================= */
        .marquee-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
            opacity: 1; 
            will-change: transform;
        }

        .marquee-track {
            display: flex;
            width: max-content;
            animation: marquee 12s linear infinite;
            will-change: transform;
        }

        .marquee-half {
            display: flex;
            gap: 5vw;
            padding-right: 5vw; 
        }

        .marquee-half img {
            height: 15vw; 
            object-fit: contain;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .sticker-container {
            position: relative;
            z-index: 5;
            width: 60vw;
            height: 60vw;
            max-width: 450px;
            max-height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .sticker-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #f0f0f0; 
            border: clamp(8px, 2vw, 15px) solid #ffffff; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.35); 
            opacity: 0;
            transform: scale(1.8) rotate(0deg); 
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.1s ease-out; 
            pointer-events: none; 
        }

        .sticker-img.show {
            opacity: 1;
        }

        /* ========================================= */
        /* --- NEW SLIDE: INTERACTIVE EARTH -------- */
        /* ========================================= */
        #slide-interactive {
            background-color: #ffffff;
        }

        #flagContainer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flag-item {
            position: absolute;
            font-size: clamp(20px, 4vw, 40px);
            opacity: 0;
            will-change: transform, opacity;
        }

        #earthWrap {
            position: absolute;
            width: clamp(200px, 35vw, 400px);
            height: clamp(200px, 35vw, 400px);
            z-index: 20;
            cursor: pointer;
        }

        #earthCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #staticImagesWrap, #dynamicImagesWrap {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #staticImagesWrap { z-index: 30; }
        #dynamicImagesWrap { z-index: 40; }

        .collision-img {
            position: absolute;
            object-fit: contain;
            /* Will be set dynamically, but default fallback */
            width: clamp(60px, 10vw, 120px);
            will-change: transform;
        }

        /* Fixed positions for Specific Elements */
        #drumGroup {
            position: absolute;
            top: 5vh;
            left: 5vw;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        #drumImg { width: clamp(80px, 12vw, 150px); }
        #rImg { width: clamp(40px, 6vw, 80px); margin-top: -10px; }

        #benImg {
            position: absolute;
            top: 5vh;
            right: 5vw;
            width: clamp(80px, 12vw, 150px);
        }

        #sixtyImg {
            position: absolute;
            left: 2vw;
            width: clamp(50px, 8vw, 100px);
            bottom: -20vh; /* Starting point */
        }

        #balloonImg {
            position: absolute;
            width: clamp(70px, 12vw, 140px);
            z-index: 50; /* Topmost dynamic element */
        }

        /* Race Track */
        #raceContainer {
            position: absolute;
            bottom: 5vh;
            left: 0;
            width: 100vw;
            height: clamp(80px, 15vw, 180px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .runner {
            position: absolute;
            height: clamp(40px, 7vw, 80px);
            object-fit: contain;
            left: -15vw;
            will-change: transform, left;
        }

        #runTop { top: 0; }
        #runBottom { bottom: 0; }

        /* ========================================= */
        /* --- SLIDE 3: 3D PSP CANVAS STYLES ------- */
        /* ========================================= */
        .machine__stage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #pspCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: pan-y; 
            cursor: grab;
        }

        #pspCanvas:active {
            cursor: grabbing;
        }

        .hidden-audio-video {
            display: none;
        }

        .mute-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 50;
            background: transparent;
            border: 1px solid rgba(0, 0, 0, 0.25);
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s ease, border-color 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mute-btn:hover {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <!-- Hardware Asset Cache -->
    <div id="hardware-cache"></div>

    <!-- Audio / Video Assets -->
    <video id="video1" class="hidden-audio-video" src="video1.mp4" loop muted playsinline crossorigin="anonymous"></video>
    <video id="video2" class="hidden-audio-video" src="video2.mp4" loop muted playsinline crossorigin="anonymous"></video>
    <audio id="b-audio" class="hidden-audio-video" src="b.mp3"></audio>
    <audio id="wc-audio" class="hidden-audio-video" src="wc.mp3" loop></audio>

    <!-- Custom Loading Overlay -->
    <div id="loaderOverlay">
        <div class="loader-content">
            <svg class="loader-ring" width="120" height="120" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="54" fill="none" stroke="#eeeeee" stroke-width="6" />
                <circle class="progress-ring" id="progressRing" cx="60" cy="60" r="54" fill="none" stroke="#ff0000" stroke-width="6" stroke-linecap="round" />
            </svg>
            <img src="6.png" id="loader-icon" alt="loading">
        </div>
    </div>

    <!-- Global Fixed UI Overlay -->
    <div id="ui-layer">
        <img src="6.png" id="b-icon" class="corner-icon" alt="Effect Icon">
        <img src="cd.png" id="cd-icon" class="corner-icon" alt="CD Icon">
    </div>

    <main class="scroll-container" id="scrollContainer">
        
        <!-- SLIDE 1 -->
        <section class="slide" id="slide-1">
            <div class="brand-text" id="brandText">ISHOWSPEED</div>
            <img src="5.png" alt="Red Sports Car" class="car" id="carImg">
            <img src="1.png" alt="Character" class="character" id="charImg">
        </section>

        <!-- SLIDE 2 -->
        <section class="slide" id="slide-2">
            <div class="marquee-container">
                <div class="marquee-track">
                    <div class="marquee-half">
                        <img src="p.png" alt="trail"><img src="p.png" alt="trail"><img src="p.png" alt="trail"><img src="p.png" alt="trail">
                        <img src="p.png" alt="trail"><img src="p.png" alt="trail"><img src="p.png" alt="trail"><img src="p.png" alt="trail">
                    </div>
                    <div class="marquee-half">
                        <img src="p.png" alt="trail"><img src="p.png" alt="trail"><img src="p.png" alt="trail"><img src="p.png" alt="trail">
                        <img src="p.png" alt="trail"><img src="p.png" alt="trail"><img src="p.png" alt="trail"><img src="p.png" alt="trail">
                    </div>
                </div>
            </div>
            <div class="sticker-container" id="stickerContainer"></div>
        </section>

        <!-- NEW SLIDE: INTERACTIVE 3D EARTH SECTION -->
        <section class="slide" id="slide-interactive">
            <div id="flagContainer"></div>
            
            <!-- Safe Zoned Images -->
            <div id="staticImagesWrap"></div>

            <!-- Dynamic Animations -->
            <div id="dynamicImagesWrap">
                <div id="drumGroup" class="collision-element">
                    <img src="drum1.png" id="drumImg">
                    <img src="r1.png" id="rImg">
                </div>
                <img src="ben1.png" id="benImg" class="collision-element">
                <img src="60m.png" id="sixtyImg" class="collision-element">
                <img src="ballon.png" id="balloonImg">
                <div id="raceContainer">
                    <img src="run1s.png" id="runTop" class="runner collision-element">
                    <img src="run1a.png" id="runBottom" class="runner collision-element">
                </div>
            </div>

            <!-- Central 3D Earth -->
            <div id="earthWrap">
                <canvas id="earthCanvas"></canvas>
            </div>
        </section>

        <!-- SLIDE 3 (Formerly PSP) -->
        <section class="slide" id="slide-3">
            <div class="machine__stage" id="stageContainer">
                <canvas id="pspCanvas"></canvas>
                <button id="muteBtn" class="mute-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="rgba(0,0,0,0.6)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                </button>
            </div>
        </section>

    </main>

    <!-- ========================================================= -->
    <!-- SCRIPT 1: REAL ASSET LOADER -->
    <!-- ========================================================= -->
    <script>
        const stickerImages = [
            '8.jpeg', '9.jpg', '10.jpg', '11.jpg', '12.jpg', '13.jpg', 
            '14.jpg', '15.jpg', '16.jpg', '17.jpg', '18.jpg', '19.jpg', 
            '20.jpg', '21.jpg', '22.jpg', '23.jpg', '24.jpeg'
        ];
        
        // Include new interactive slide static/dynamic images
        const newSectionImages = [
            'crboy.png', 'crmeet.png', 'ksi.png', 'kai.png', 'face.png', 'messi.png', 
            'ney.png', 'prime.png', 'eat.png', 'boom.png', 'bal.png', 'i1.png', 
            'kunfu.png', 'goal.png', 'drum1.png', 'drum2.png', 'r1.png', 'r2.png', 
            'run1s.png', 'run2s.png', 'run1a.png', 'run2a.png', 'ben1.png', 'ben2.png', 
            'ballon.png', '60m.png', 'https://unpkg.com/three@0.160.0/examples/textures/planets/earth_atmos_2048.jpg'
        ];

        const allImages = ['1.png', '2.png', '3.png', '4.png', '5.png', 'p.png', '6.png', '7.png', 'cd.png', ...stickerImages, ...newSectionImages];
        
        const totalAssets = allImages.length + 1; // +1 for PSP GLB
        let loadedAssets = 0;

        const loaderOverlay = document.getElementById('loaderOverlay');
        const loaderIcon = document.getElementById('loader-icon');
        const progressRing = document.getElementById('progressRing');
        const loaderRingSvg = document.querySelector('.loader-ring');
        const realBIcon = document.getElementById('b-icon');
        const hardwareCache = document.getElementById('hardware-cache');
        const circ = 339.29; 

        window.UPDATE_REAL_PROGRESS = function() {
            loadedAssets++;
            let percent = (loadedAssets / totalAssets) * 100;
            progressRing.style.strokeDashoffset = circ - (circ * percent / 100);

            if (loadedAssets >= totalAssets) {
                finalizeLoading();
            }
        };

        allImages.forEach(src => {
            const img = new Image();
            img.onload = window.UPDATE_REAL_PROGRESS;
            img.onerror = window.UPDATE_REAL_PROGRESS; 
            // Apply crossorigin for the external Earth texture to cache cleanly
            if(src.includes('http')) img.crossOrigin = 'anonymous'; 
            img.src = src;
            hardwareCache.appendChild(img); 
        });

        let isSix = true;
        const toggleInt = setInterval(() => {
            isSix = !isSix;
            loaderIcon.src = isSix ? '6.png' : '7.png';
        }, 200);

        function finalizeLoading() {
            clearInterval(toggleInt);
            
            loaderIcon.src = '6.png'; 
            loaderRingSvg.style.opacity = '0'; 
            loaderIcon.style.transformOrigin = 'top left'; 

            const targetRect = realBIcon.getBoundingClientRect();
            const startRect = loaderIcon.getBoundingClientRect();
            
            const dx = targetRect.left - startRect.left;
            const dy = targetRect.top - startRect.top;
            const scale = targetRect.width / startRect.width;

            loaderOverlay.style.transition = 'background-color 0.8s ease';
            loaderOverlay.style.backgroundColor = 'transparent';

            loaderIcon.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
            loaderIcon.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;

            setTimeout(() => {
                realBIcon.style.opacity = '1'; 
                loaderOverlay.remove(); 
                
                init2DAnimation(); 
                
                // Exactly 9 SECONDS after entering site, trigger sound effect
                setTimeout(triggerBEffect, 9000);
            }, 800);
        }

        // -----------------------------------------------------
        // CORNER ICON INTERACTIVITY & PHYSICS
        // -----------------------------------------------------
        const bIcon = document.getElementById('b-icon');
        const bAudio = document.getElementById('b-audio');
        const cdIcon = document.getElementById('cd-icon');
        const wcAudio = document.getElementById('wc-audio');
        const scrollContainer = document.getElementById('scrollContainer');

        let isCdPlaying = false;
        let cdRotation = 0;
        let cdVelocity = 0;
        let targetCdRotation = 0;
        let bRotation = 0;

        function triggerBEffect() {
            bIcon.src = '7.png';
            bAudio.currentTime = 0;
            const playPromise = bAudio.play();
            if(playPromise !== undefined) playPromise.catch(e => {});

            setTimeout(() => {
                bIcon.src = '6.png';
                bAudio.pause();
            }, 300); 
        }

        bIcon.addEventListener('click', triggerBEffect);

        cdIcon.addEventListener('click', () => {
            isCdPlaying = !isCdPlaying;
            if (isCdPlaying) {
                wcAudio.play().catch(e => {});
            } else {
                wcAudio.pause();
            }
        });

        scrollContainer.addEventListener('scroll', () => {
            bRotation = Math.sin(scrollContainer.scrollTop * 0.005) * 20;
        });

        function uiPhysicsLoop() {
            if (isCdPlaying) {
                cdVelocity = Math.min(cdVelocity + 0.05, 3.5); 
                cdRotation += cdVelocity;
            } else {
                if (cdVelocity > 0) {
                    cdVelocity -= 0.03; 
                    cdRotation += cdVelocity;
                    if (cdVelocity <= 0) {
                        cdVelocity = 0;
                        targetCdRotation = Math.round(cdRotation / 360) * 360; 
                    }
                } else {
                    cdRotation += (targetCdRotation - cdRotation) * 0.08;
                }
            }

            cdIcon.style.transform = `rotate(${cdRotation}deg)`;
            bIcon.style.transform = `rotate(${bRotation}deg)`;

            requestAnimationFrame(uiPhysicsLoop);
        }
        uiPhysicsLoop();

        // -----------------------------------------------------
        // SLIDE 2: FAST PHOTO STICKER SEQUENCE
        // -----------------------------------------------------
        const slide2El = document.getElementById('slide-2');
        const stickerContainer = document.getElementById('stickerContainer');
        let stickerInterval;
        let isStickerPlaying = false;
        let isSequenceRunning = false; 

        function playStickerSequence() {
            if (isStickerPlaying) return;
            isStickerPlaying = true;
            isSequenceRunning = false;
            
            stickerContainer.innerHTML = '';
            let currentIndex = 0;

            stickerInterval = setInterval(() => {
                if (currentIndex >= stickerImages.length) {
                    clearInterval(stickerInterval);
                    return;
                }

                const img = document.createElement('img');
                img.src = stickerImages[currentIndex];
                img.className = 'sticker-img';
                
                const rot = (Math.random() - 0.5) * 20;
                const offX = (Math.random() - 0.5) * 30;
                const offY = (Math.random() - 0.5) * 30;
                
                const targetTransform = `translate(${offX}px, ${offY}px) scale(1) rotate(${rot}deg)`;
                img.dataset.targetTransform = targetTransform;

                stickerContainer.appendChild(img);
                void img.offsetWidth; 

                img.classList.add('show');
                img.style.transform = targetTransform;

                currentIndex++;
            }, 150); 
        }

        stickerContainer.addEventListener('click', () => {
            if (isSequenceRunning) return;
            const stickers = Array.from(document.querySelectorAll('.sticker-img'));
            if (stickers.length < 2) return; 

            const isExpanded = stickers[1].classList.contains('show');
            isSequenceRunning = true;

            if (isExpanded) {
                let delay = 0;
                for (let i = stickers.length - 1; i >= 1; i--) {
                    setTimeout(() => {
                        stickers[i].classList.remove('show');
                        stickers[i].style.transform = 'scale(1.8) rotate(0deg)';
                    }, delay);
                    delay += 150; 
                }
                setTimeout(() => isSequenceRunning = false, delay + 200);
            } else {
                let delay = 0;
                for (let i = 1; i < stickers.length; i++) {
                    setTimeout(() => {
                        stickers[i].classList.add('show');
                        stickers[i].style.transform = stickers[i].dataset.targetTransform;
                    }, delay);
                    delay += 150; 
                }
                setTimeout(() => isSequenceRunning = false, delay + 200);
            }
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
                    playStickerSequence();
                } else if (!entry.isIntersecting) {
                    clearInterval(stickerInterval);
                    isStickerPlaying = false; 
                }
            });
        }, { root: scrollContainer, threshold: [0, 0.5] }); 
        
        observer.observe(slide2El);

        // -----------------------------------------------------
        // SLIDE 1: 2D JUMP ANIMATION LOGIC
        // -----------------------------------------------------
        const carEl = document.getElementById('carImg');
        const charEl = document.getElementById('charImg');
        const textEl = document.getElementById('brandText');

        function init2DAnimation() {
            carEl.style.display = 'block';
            charEl.style.display = 'block';
            
            let startTime = performance.now();
            const totalDuration = 5000; 

            function updateAnimation(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / totalDuration, 1.0);
                const vw = window.innerWidth;

                const textRect = textEl.getBoundingClientRect();
                const sceneRect = document.getElementById('slide-1').getBoundingClientRect();
                const baselineBottom = (sceneRect.bottom - textRect.bottom) + (vw * 0.025); 
                
                const impactPoint = (vw / 2) + (textRect.width / 2) - (vw * 0.01); 
                
                const maxJumpHeight = textRect.height * 1.15; 
                const charRestX = vw * 0.05; 
                const charTargetX = vw * 0.70; 
                const jumpDistance = charTargetX - charRestX;

                const carWidth = carEl.getBoundingClientRect().width || (vw * 0.2);
                const carStartX = vw + carWidth + (vw * 0.05);

                let carX = carStartX;
                let textTranslateX = 0;
                let charBottomOffset = baselineBottom;
                let charX = charRestX;
                let currentPose = '1.png';

                if (progress > 0.15) {
                    const carProgress = Math.min((progress - 0.15) / 0.75, 1.0); 
                    const endCarX = -carWidth - (vw * 0.1); 
                    const easeP = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
                    carX = carStartX - (carStartX - endCarX) * easeP(carProgress);
                }

                if (carX <= impactPoint) {
                    textTranslateX = carX - impactPoint; 
                }

                const jumpStart = 0.30;
                const jumpEnd = 0.65;
                
                if (progress >= jumpStart && progress <= jumpEnd) {
                    const jumpP = (progress - jumpStart) / (jumpEnd - jumpStart);
                    const arc = Math.pow(Math.sin(jumpP * Math.PI), 0.4);
                    
                    charBottomOffset = baselineBottom + (arc * maxJumpHeight);

                const i1 = idx ? idx.getX(i + 1) : i + 1;
                const i2 = idx ? idx.getX(i + 2) : i + 2;
                a.fromBufferAttribute(pos, i0);

            const geo = mesh.geometry;

            const e2 = new THREE.Vector3().crossVectors(nrm, e1).normalize();

            for (let i = 0; i < wp.length; i++) {
                const x = wp[i].dot(e1), y = wp[i].dot(e2);
                a.push(x); b.push(y); ma += x; mb += y;
            }
            ma /= a.length; mb /= b.length;

            let Saa = 0, Sbb = 0, Sab = 0;
            for (let i = 0; i < a.length; i++) {
                const da = a[i] - ma, db = b[i] - mb;
                Saa += da * da; Sbb += db * db; Sab += da * db;
            }
            const th = 0.5 * Math.atan2(2 * Sab, Saa - Sbb);
            const cs = Math.cos(th), sn = Math.sin(th);

            const U = e1.clone().multiplyScalar(cs).addScaledVector(e2, sn).normalize();

            let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
            const us = [], vs = [];
            for (let i = 0; i < wp.length; i++) {
                const u = wp[i].dot(U), w = wp[i].dot(V);
                us.push(u); vs.push(w);
                if (u < minU) minU = u; if (u > maxU) maxU = u;
                if (w < minV) minV = w; if (w > maxV) maxV = w;
            }
            const du = (maxU - minU) || 1, dv = (maxV - minV) || 1;
            const uv = new Float32Array(p.count * 2);
            for (let i = 0; i < p.count; i++) {
                uv[i * 2] = (us[i] - minU) / du;
                uv[i * 2 + 1] = (vs[i] - minV) / dv;
            }
            geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));

                    col = mix(vec3(0.55, 0.85, 1.0) * slit * 2.4, col, open);
                    col *= open;

                model.position.sub(new THREE.Box3().setFromObject(model).getCenter(new THREE.Vector3()));
                
                fitToView();
                
                if (window.UPDATE_REAL_PROGRESS) window.UPDATE_REAL_PROGRESS();
            },
            undefined,
            (err) => {
                console.error('Failed to load psp.glb', err);
                if (window.UPDATE_REAL_PROGRESS) window.UPDATE_REAL_PROGRESS();
            }
        );

        function mapButton(role, mesh) {
            const parent = mesh.parent || model;
            const pq = new THREE.Quaternion(); parent.getWorldQuaternion(pq);
            const ps = new THREE.Vector3(); parent.getWorldScale(ps);
            const axis = new THREE.Vector3(0, 0, 1).applyQuaternion(pq.invert());
            axis.set(axis.x / (ps.x || 1), axis.y / (ps.y || 1), axis.z / (ps.z || 1));
            
            buttons[role] = { role, mesh, home: mesh.position.clone(), axis, t: 0 };
            mesh.userData.role = role;
            pressable.push(mesh);
        }

        const raycaster = new THREE.Raycaster();
        const ptr = new THREE.Vector2();
        
        let isDragging = false;
        let startTouchX = 0;
        let startTouchY = 0;
        let dragTargetX = 0;
        let dragTargetY = 0;
        let previousMousePosition = { x: 0, y: 0 };

        pspCanvas.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startTouchX = e.clientX;
            startTouchY = e.clientY;
            previousMousePosition = { x: e.clientX, y: e.clientY };
            pspCanvas.setPointerCapture(e.pointerId);
        });

        pspCanvas.addEventListener('pointermove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                dragTargetX += deltaX * 0.006;
                dragTargetY += deltaY * 0.006;
                dragTargetY = Math.max(-0.6, Math.min(0.6, dragTargetY));

                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        function pressButton(role) {
            const b = buttons[role];
            if (b) {
                b.t = 1; 
                const wp = new THREE.Box3().setFromObject(b.mesh).getCenter(new THREE.Vector3());
                pressLight.position.copy(wp).add(new THREE.Vector3(0, 0, 1.4));
                pressLight.color.set(0x7fe3ff);
                pressLightLife = 1;
            }
            
            if (currentVideo === video1) {
                video1.pause();
                video2.currentTime = 0;
                video2.play();
                currentVideo = video2;
                crtMat.uniforms.uTex.value = videoTex2;
            } else {
                video2.pause();
                video1.currentTime = 0;
                video1.play();
                currentVideo = video1;
                crtMat.uniforms.uTex.value = videoTex1;
            }
            
            crtMat.uniforms.uWarp.value = 1.0; 
        }

        pspCanvas.addEventListener('click', (e) => {
            const dragDistance = Math.abs(e.clientX - startTouchX) + Math.abs(e.clientY - startTouchY);
            
            if (dragDistance < 10) {
                const r = pspCanvas.getBoundingClientRect();
                ptr.x = ((e.clientX - r.left) / r.width) * 2 - 1;
                ptr.y = -((e.clientY - r.top) / r.height) * 2 + 1;

                raycaster.setFromCamera(ptr, camera);
                const hits = raycaster.intersectObjects(pressable, false);
                
                if (hits.length > 0 && hits[0].object.userData.role) {
                    pressButton(hits[0].object.userData.role);
                }
            }
        });

        pspCanvas.addEventListener('pointerup', (e) => {
            isDragging = false;
            pspCanvas.releasePointerCapture(e.pointerId);
        });

        const videoObserver = new IntersectionObserver((es) => {
            if (es[0].isIntersecting) {
                currentVideo.play().catch(e => {});
            } else {
                currentVideo.pause();
            }
        }, { root: scrollContainer, threshold: 0.1 });
        videoObserver.observe(pspCanvas);

        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        renderPass.clearColor = new THREE.Color(0xffffff);
        renderPass.clearAlpha = 0; 
        composer.addPass(renderPass);
        composer.addPass(new OutputPass());

        function fitToView() {
            if (!model.children.length) return;
            const size = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3());
            if (size.x === 0 || size.y === 0) return;
            
            const fill = 0.7; 
            const vFov = THREE.MathUtils.degToRad(camera.fov);
            const distH = (size.y / 2) / Math.tan(vFov / 2);
            const distW = (size.x / 2) / (Math.tan(vFov / 2) * camera.aspect);
            camera.position.set(0, 0, Math.max(distH, distW) / fill + size.z);
            camera.lookAt(0, 0, 0);
            camera.updateProjectionMatrix();
        }

        window.addEventListener('resize', () => {
            const w = stageContainer.clientWidth, h = stageContainer.clientHeight;
            if(w === 0 || h === 0) return;
            renderer.setSize(w, h, false);
            composer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            fitToView();
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(0.05, clock.getDelta());
            const t = clock.elapsedTime;
            
            // Earth Rotation Logic
            earthMesh.rotation.y += 0.01;
            earthRenderer.render(earthScene, earthCamera);

            // PSP Logic
            root.rotation.y += (dragTargetX - root.rotation.y) * 0.1;
            root.rotation.x += (dragTargetY - root.rotation.x) * 0.1;

            idleGroup.rotation.y = Math.sin(t * 1.5) * 0.05;
            idleGroup.rotation.x = Math.cos(t * 1.2) * 0.03;
            idleGroup.position.y = Math.sin(t * 2.0) * 0.08;

            crtMat.uniforms.uTime.value = t;
            crtMat.uniforms.uWarp.value *= Math.pow(0.0025, dt); 
            if (crtMat.uniforms.uWarp.value < 0.001) crtMat.uniforms.uWarp.value = 0;

            const PRESS_DEPTH = 0.17;
            for (const k in buttons) {
                const b = buttons[k];
                if (b.t <= 0.0005) continue;
                b.t *= Math.pow(0.004, dt);
                if (b.t < 0.0005) b.t = 0;
                const d = b.axis.clone().multiplyScalar(-PRESS_DEPTH * b.t);
                b.mesh.position.copy(b.home).add(d);
            }

            if (pressLightLife > 0) {
                pressLightLife -= dt * 3.4;
                pressLight.intensity = Math.max(0, pressLightLife) * 26;
            } else {
                pressLight.intensity = 0;
            }

            composer.render();
        }
        animate();
        window.dispatchEvent(new Event('resize'));
    </script>
</body>
</html>
