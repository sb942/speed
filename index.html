<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Interactive Scrolling Motion Graphic</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        overflow-x: hidden;
        /* Scroll Snapping */
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
      }

      .slide {
        position: relative;
        width: 100vw;
        height: 100vh;
        scroll-snap-align: start;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* ========================================= */
      /* --- SLIDE 1: 2D ANIMATION STYLES --- */
      /* ========================================= */
      #slide-1 {
        background-color: #ffffff;
      }

      .brand-text {
        position: absolute;
        font-family: Impact, "Arial Black", sans-serif;
        font-weight: 900;
        font-stretch: ultra-condensed;
        color: #ff0000;
        text-transform: uppercase;
        font-size: clamp(1rem, 13vw, 13rem);
        letter-spacing: 0.05em;
        transform: scaleX(0.75);
        white-space: nowrap;
        user-select: none;
        z-index: 10;
        will-change: transform;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) scaleX(0.75);
      }

      .car {
        position: absolute;
        height: clamp(30px, 9vw, 190px);
        object-fit: contain;
        z-index: 20;
        will-change: transform, left, bottom;
        display: none;
        pointer-events: none;
      }

      .character {
        position: absolute;
        height: clamp(40px, 13vw, 250px);
        object-fit: contain;
        z-index: 30;
        will-change: transform, bottom, left;
        display: none;
        pointer-events: none;
      }

      /* ========================================= */
      /* --- SLIDE 2: 3D PSP CANVAS STYLES --- */
      /* ========================================= */
      #slide-2 {
        /* Pure white CSS background */
        background-color: #ffffff;
      }

      .machine__stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
      }

      #pspCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none; /* Prevents scroll interference when dragging */
        cursor: grab;
      }

      #pspCanvas:active {
        cursor: grabbing;
      }

      .hidden-video {
        display: none;
      }

      /* ========================================= */
      /* --- LOADER STYLES --- */
      /* ========================================= */
      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        font-family: sans-serif;
        color: #333;
        transition: opacity 0.5s ease;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #ff0000;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loader">
      <div class="spinner"></div>
      <div id="loader-text">Loading 2D Assets & 3D Engine...</div>
    </div>

    <!-- Hidden Video Sources for the PSP Screen -->
    <video
      id="video1"
      class="hidden-video"
      src="video1.mp4"
      loop
      muted
      playsinline
      crossorigin="anonymous"
    ></video>
    <video
      id="video2"
      class="hidden-video"
      src="video2.mp4"
      loop
      muted
      playsinline
      crossorigin="anonymous"
    ></video>

    <!-- SLIDE 1: The 2D Motion Graphic -->
    <section class="slide" id="slide-1">
      <div class="brand-text" id="brandText">ISHOWSPEED</div>
      <img src="5.png" alt="Red Sports Car" class="car" id="carImg" />
      <img src="1.png" alt="Character" class="character" id="charImg" />
    </section>

    <!-- SLIDE 2: The 3D Interactive PSP -->
    <section class="slide" id="slide-2">
      <div class="machine__stage" id="stageContainer">
        <canvas id="pspCanvas"></canvas>
      </div>
    </section>

    <!-- ========================================================= -->
    <!-- SCRIPT 1: 2D ANIMATION LOGIC (Vanilla JS) -->
    <!-- ========================================================= -->
    <script>
      const imageSources = ["1.png", "2.png", "3.png", "4.png", "5.png"];
      let loadedCount = 0;

      const carEl = document.getElementById("carImg");
      const charEl = document.getElementById("charImg");
      const textEl = document.getElementById("brandText");

      // Global flag to tell the 3D engine when 2D is done downloading
      window.ASSETS_2D_LOADED = false;

      function preload2DAssets() {
        imageSources.forEach((src) => {
          const img = new Image();
          img.src = src;
          img.onload = () => {
            loadedCount++;
            if (loadedCount === imageSources.length) {
              window.ASSETS_2D_LOADED = true;
              init2DAnimation();
            }
          };
        });
      }

      function init2DAnimation() {
        carEl.style.display = "block";
        charEl.style.display = "block";

        let startTime = performance.now();
        const totalDuration = 5000;

        function updateAnimation(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / totalDuration, 1.0);
          const vw = window.innerWidth;
          const vh = window.innerHeight;

          const textRect = textEl.getBoundingClientRect();
          const textBottom = vh / 2 - textRect.height / 2;

          const baselineBottom = textBottom + vw * 0.015;
          const impactPoint = vw / 2 + textRect.width / 2 - vw * 0.01;

          // RESTORED PERFECT JUMP MATH
          const maxJumpHeight = textRect.height * 1.15;
          const charRestX = vw * 0.05;
          const charTargetX = vw * 0.7;
          const jumpDistance = charTargetX - charRestX;

          const carWidth = carEl.getBoundingClientRect().width || vw * 0.2;
          const carStartX = vw + carWidth + vw * 0.05;

          let carX = carStartX;
          let textTranslateX = 0;
          let charBottomOffset = baselineBottom;
          let charX = charRestX;
          let currentPose = "1.png";

          // Sequence Timing
          if (progress > 0.15) {
            const carProgress = Math.min((progress - 0.15) / 0.75, 1.0);
            const endCarX = -carWidth - vw * 0.1;
            const easeP = (x) =>
              x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
            carX = carStartX - (carStartX - endCarX) * easeP(carProgress);
          }

          if (carX <= impactPoint) {
            textTranslateX = carX - impactPoint;
          }

          const jumpStart = 0.3;
          const jumpEnd = 0.65;

          if (progress >= jumpStart && progress <= jumpEnd) {
            const jumpP = (progress - jumpStart) / (jumpEnd - jumpStart);

            // RESTORED STEEP ANGLE SHAPE
            const arc = Math.pow(Math.sin(jumpP * Math.PI), 0.4);

            charBottomOffset = baselineBottom + arc * maxJumpHeight;
            charX = charRestX + jumpP * jumpDistance;

            if (jumpP < 0.2) currentPose = "1.png";
            else if (jumpP < 0.5) currentPose = "2.png";
            else if (jumpP < 0.8) currentPose = "3.png";
            else currentPose = "4.png";
          } else if (progress > jumpEnd) {
            charBottomOffset = baselineBottom;
            charX = charTargetX;
            currentPose = "4.png";
          }

          // Apply CSS Updates
          textEl.style.transform = `translate(calc(-50% + ${textTranslateX}px), -50%) scaleX(0.75)`;
          carEl.style.left = `${carX}px`;
          carEl.style.bottom = `${baselineBottom}px`;
          charEl.style.left = `${charX}px`;
          charEl.style.bottom = `${charBottomOffset}px`;

          if (charEl.getAttribute("src") !== currentPose)
            charEl.src = currentPose;

          // Loop
          if (progress < 1.0) {
            requestAnimationFrame(updateAnimation);
          } else {
            setTimeout(() => {
              requestAnimationFrame((t) => {
                startTime = t;
                requestAnimationFrame(updateAnimation);
              });
            }, 1000);
          }
        }
        requestAnimationFrame(updateAnimation);
      }

      window.addEventListener("load", preload2DAssets);
    </script>

    <!-- ========================================================= -->
    <!-- SCRIPT 2: 3D PSP LOGIC (Three.js WebGL Engine) -->
    <!-- ========================================================= -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      const canvas = document.getElementById("pspCanvas");
      const stageContainer = document.getElementById("stageContainer");
      const loaderEl = document.getElementById("loader");

      // Videos
      const video1 = document.getElementById("video1");
      const video2 = document.getElementById("video2");
      let currentVideo = video1;

      // 1. Scene Setup - Transparent to reveal CSS pure white
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      // Set clear color to fully transparent
      renderer.setClearColor(0xffffff, 0);

      const scene = new THREE.Scene();
      scene.background = null;

      const camera = new THREE.PerspectiveCamera(
        34,
        window.innerWidth / window.innerHeight,
        0.1,
        400,
      );
      camera.position.set(0, 0, 30);

      const root = new THREE.Group();
      const idleGroup = new THREE.Group();
      const model = new THREE.Group();

      idleGroup.add(model);
      root.add(idleGroup);
      scene.add(root);

      // 2. Lighting Setup
      const hemi = new THREE.HemisphereLight(0xffffff, 0xaaaaaa, 1.5);
      scene.add(hemi);

      const keyLight = new THREE.DirectionalLight(0xbcd4e8, 1.2);
      keyLight.position.set(-8, 9, 12);
      scene.add(keyLight);

      const rimIce = new THREE.DirectionalLight(0x7fe3ff, 1.5);
      rimIce.position.set(11, 4, -9);
      scene.add(rimIce);

      const rimHot = new THREE.DirectionalLight(0xff2e7e, 1.0);
      rimHot.position.set(-12, -5, -7);
      scene.add(rimHot);

      const pressLight = new THREE.PointLight(0x7fe3ff, 0, 9, 2);
      scene.add(pressLight);
      let pressLightLife = 0;

      // 3. UV Math Functions
      function largestFaceNormal(mesh) {
        const geo = mesh.geometry;
        const pos = geo.getAttribute("position");
        const idx = geo.getIndex();
        const count = idx ? idx.count : pos.count;
        const a = new THREE.Vector3(),
          b = new THREE.Vector3(),
          c = new THREE.Vector3();
        const ab = new THREE.Vector3(),
          ac = new THREE.Vector3(),
          cr = new THREE.Vector3();
        let best = -1;
        const out = new THREE.Vector3(0, 0, 1);
        for (let i = 0; i < count; i += 3) {
          const i0 = idx ? idx.getX(i) : i;
          const i1 = idx ? idx.getX(i + 1) : i + 1;
          const i2 = idx ? idx.getX(i + 2) : i + 2;
          a.fromBufferAttribute(pos, i0);
          b.fromBufferAttribute(pos, i1);
          c.fromBufferAttribute(pos, i2);
          ab.subVectors(b, a);
          ac.subVectors(c, a);
          cr.crossVectors(ab, ac);
          const area = cr.lengthSq();
          if (area > best) {
            best = area;
            out.copy(cr).normalize();
          }
        }
        return out
          .applyMatrix3(new THREE.Matrix3().getNormalMatrix(mesh.matrixWorld))
          .normalize();
      }

      function buildScreenUVs(mesh, nrm, right, up) {
        const geo = mesh.geometry;
        const p = geo.getAttribute("position");
        const mw = mesh.matrixWorld;
        const wp = [];
        const v = new THREE.Vector3();
        for (let i = 0; i < p.count; i++) {
          v.fromBufferAttribute(p, i).applyMatrix4(mw);
          wp.push(v.clone());
        }

        const e1 = right.clone().projectOnPlane(nrm).normalize();
        const e2 = new THREE.Vector3().crossVectors(nrm, e1).normalize();

        const a = [],
          b = [];
        let ma = 0,
          mb = 0;
        for (let i = 0; i < wp.length; i++) {
          const x = wp[i].dot(e1),
            y = wp[i].dot(e2);
          a.push(x);
          b.push(y);
          ma += x;
          mb += y;
        }
        ma /= a.length;
        mb /= b.length;

        let Saa = 0,
          Sbb = 0,
          Sab = 0;
        for (let i = 0; i < a.length; i++) {
          const da = a[i] - ma,
            db = b[i] - mb;
          Saa += da * da;
          Sbb += db * db;
          Sab += da * db;
        }
        const th = 0.5 * Math.atan2(2 * Sab, Saa - Sbb);
        const cs = Math.cos(th),
          sn = Math.sin(th);

        const U = e1
          .clone()
          .multiplyScalar(cs)
          .addScaledVector(e2, sn)
          .normalize();
        const V = e1
          .clone()
          .multiplyScalar(-sn)
          .addScaledVector(e2, cs)
          .normalize();
        if (U.dot(right) < 0) U.negate();
        if (V.dot(up) < 0) V.negate();

        let minU = Infinity,
          maxU = -Infinity,
          minV = Infinity,
          maxV = -Infinity;
        const us = [],
          vs = [];
        for (let i = 0; i < wp.length; i++) {
          const u = wp[i].dot(U),
            w = wp[i].dot(V);
          us.push(u);
          vs.push(w);
          if (u < minU) minU = u;
          if (u > maxU) maxU = u;
          if (w < minV) minV = w;
          if (w > maxV) maxV = w;
        }
        const du = maxU - minU || 1,
          dv = maxV - minV || 1;
        const uv = new Float32Array(p.count * 2);
        for (let i = 0; i < p.count; i++) {
          uv[i * 2] = (us[i] - minU) / du;
          uv[i * 2 + 1] = (vs[i] - minV) / dv;
        }
        geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
      }

      // 4. CRT Shader & Video Textures
      const videoTex1 = new THREE.VideoTexture(video1);
      videoTex1.colorSpace = THREE.SRGBColorSpace;
      const videoTex2 = new THREE.VideoTexture(video2);
      videoTex2.colorSpace = THREE.SRGBColorSpace;

      let activeVideoTexture = videoTex1;

      const crtMat = new THREE.ShaderMaterial({
        uniforms: {
          uTex: { value: activeVideoTexture },
          uTime: { value: 0 },
          uPower: { value: 1.0 },
          uWarp: { value: 0 },
          uGrid: { value: new THREE.Vector2(240, 136) },
          uBright: { value: 0.92 },
        },
        transparent: false,
        toneMapped: false,
        vertexShader: `
                varying vec2 vUv;
                void main(){
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
                }`,
        fragmentShader: `
                precision highp float;
                uniform sampler2D uTex;
                uniform float uTime, uPower, uWarp, uBright;
                uniform vec2 uGrid;
                varying vec2 vUv;

                float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }

                void main(){
                    vec2 uv = vUv;
                    
                    vec2 c = uv - 0.5;
                    float r2 = dot(c, c);
                    uv = 0.5 + c * (1.0 + 0.032 * r2);

                    float band = step(0.5, hash(vec2(floor(uv.y * 26.0), floor(uTime * 22.0))));
                    uv.x += uWarp * (band - 0.5) * 0.09;

                    if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
                        gl_FragColor = vec4(0.005, 0.008, 0.013, 1.0);
                        return;
                    }

                    vec2 g = uGrid;
                    vec2 quv = (floor(uv * g) + 0.5) / g;

                    float ab = (0.0005 + 0.0035 * r2) * (1.0 + uWarp * 6.0);
                    float rr = texture2D(uTex, vec2(quv.x + ab, quv.y)).r;
                    float gg = texture2D(uTex, quv).g;
                    float bb = texture2D(uTex, vec2(quv.x - ab, quv.y)).b;
                    vec3 col = vec3(rr, gg, bb);

                    float sub = mod(floor(uv.x * g.x * 3.0), 3.0);
                    vec3 mask = vec3(sub < 1.0 ? 1.0 : 0.90, (sub >= 1.0 && sub < 2.0) ? 1.0 : 0.90, sub >= 2.0 ? 1.0 : 0.90);
                    col *= mask;
                    float scan = 0.93 + 0.07 * cos(uv.y * g.y * 6.28318);
                    col *= scan;

                    col += vec3(0.05, 0.075, 0.10) * pow(1.0 - uv.y, 3.0) * 0.45;
                    col *= 1.0 - 0.30 * pow(r2 * 1.55, 1.6);
                    col += (hash(quv * 620.0) - 0.5) * 0.012;

                    float open = smoothstep(0.0, 1.0, uPower);
                    float slit = smoothstep(open * 0.62 + 0.002, 0.0, abs(uv.y - 0.5));
                    col = mix(vec3(0.55, 0.85, 1.0) * slit * 2.4, col, open);
                    col *= open;

                    gl_FragColor = vec4(col * uBright, 1.0);
                }`,
      });

      // 5. Load Model
      let screenMesh = null;
      const buttons = {};
      const pressable = [];
      let modelReady = false;

      new GLTFLoader().load(
        "psp.glb",
        (gltf) => {
          model.add(gltf.scene);
          gltf.scene.updateWorldMatrix(true, true);

          const bin = []; // Container for hidden geometry that messes up size calculations

          gltf.scene.traverse((o) => {
            if (!o.isMesh) return;
            const n = o.name.toLowerCase();

            // CRITICAL FIX: Delete the massive invisible ground plane!
            // This was throwing off the entire scaling calculation.
            if (n.includes("ground")) {
              bin.push(o);
              return;
            }

            if (n.includes("screen") || n.includes("display")) {
              screenMesh = o;
              o.material = crtMat;
            }

            const m = n.match(/^button(\d+)/);
            if (m || n.includes("button")) {
              let role = n;
              if (n.includes("left") || n.includes("dpad_l")) role = "left";
              if (n.includes("right") || n.includes("dpad_r")) role = "right";
              if (n.includes("cross") || n.includes("x")) role = "cross";
              if (n.includes("circle") || n.includes("o")) role = "circle";

              mapButton(role, o);
            }
          });

          // Physically remove the ground planes so they don't break our BoundingBox math
          bin.forEach((o) => {
            o.parent && o.parent.remove(o);
          });

          if (screenMesh) {
            const sNrm = largestFaceNormal(screenMesh);
            if (sNrm.z < 0) sNrm.negate();
            buildScreenUVs(
              screenMesh,
              sNrm,
              new THREE.Vector3(1, 0, 0),
              new THREE.Vector3(0, 1, 0),
            );
          }

          const size = new THREE.Box3()
            .setFromObject(model)
            .getSize(new THREE.Vector3());
          model.scale.setScalar(10 / Math.max(size.x, size.y, size.z));
          model.updateWorldMatrix(true, true);
          model.position.sub(
            new THREE.Box3()
              .setFromObject(model)
              .getCenter(new THREE.Vector3()),
          );

          modelReady = true;
          fitToView();
          checkLoaderCompletion();
        },
        undefined,
        (err) => {
          console.error("Failed to load psp.glb", err);
          document.getElementById("loader-text").innerHTML =
            "Error loading psp.glb. Ensure you are running a Local Server.";
        },
      );

      function mapButton(role, mesh) {
        const parent = mesh.parent || model;
        const pq = new THREE.Quaternion();
        parent.getWorldQuaternion(pq);
        const ps = new THREE.Vector3();
        parent.getWorldScale(ps);
        const axis = new THREE.Vector3(0, 0, 1).applyQuaternion(pq.invert());
        axis.set(
          axis.x / (ps.x || 1),
          axis.y / (ps.y || 1),
          axis.z / (ps.z || 1),
        );

        buttons[role] = { role, mesh, home: mesh.position.clone(), axis, t: 0 };
        mesh.userData.role = role;
        pressable.push(mesh);
      }

      function checkLoaderCompletion() {
        if (modelReady && window.ASSETS_2D_LOADED) {
          loaderEl.style.opacity = "0";
          setTimeout(() => (loaderEl.style.display = "none"), 500);
        } else {
          setTimeout(checkLoaderCompletion, 100);
        }
      }

      // 6. Raycasting & DRAG Interaction
      const raycaster = new THREE.Raycaster();
      const ptr = new THREE.Vector2();

      let isDragging = false;
      let hasDragged = false;
      let dragTargetX = 0;
      let dragTargetY = 0;
      let previousMousePosition = { x: 0, y: 0 };

      canvas.addEventListener("pointerdown", (e) => {
        isDragging = true;
        hasDragged = false;
        previousMousePosition = { x: e.clientX, y: e.clientY };
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener("pointermove", (e) => {
        if (isDragging) {
          const deltaX = e.clientX - previousMousePosition.x;
          const deltaY = e.clientY - previousMousePosition.y;

          // If moved more than 2 pixels, count it as a drag (not a tap)
          if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) {
            hasDragged = true;
          }

          // Adjust rotation sensitivity
          dragTargetX += deltaX * 0.006;
          dragTargetY += deltaY * 0.006;

          // Clamp vertical rotation so you can't flip it upside down
          dragTargetY = Math.max(-0.6, Math.min(0.6, dragTargetY));

          previousMousePosition = { x: e.clientX, y: e.clientY };
        }
      });

      function pressButton(role) {
        const b = buttons[role];
        if (b) {
          b.t = 1;
          const wp = new THREE.Box3()
            .setFromObject(b.mesh)
            .getCenter(new THREE.Vector3());
          pressLight.position.copy(wp).add(new THREE.Vector3(0, 0, 1.4));
          pressLight.color.set(0x7fe3ff);
          pressLightLife = 1;
        }

        console.log("Pressed:", role);

        if (currentVideo === video1) {
          video1.pause();
          video2.currentTime = 0;
          video2.play();
          currentVideo = video2;
          crtMat.uniforms.uTex.value = videoTex2;
        } else {
          video2.pause();
          video1.currentTime = 0;
          video1.play();
          currentVideo = video1;
          crtMat.uniforms.uTex.value = videoTex1;
        }

        crtMat.uniforms.uWarp.value = 1.0;
      }

      canvas.addEventListener("pointerup", (e) => {
        isDragging = false;
        canvas.releasePointerCapture(e.pointerId);

        // Only trigger a button press if the user was tapping, not dragging
        if (!hasDragged) {
          const r = canvas.getBoundingClientRect();
          ptr.x = ((e.clientX - r.left) / r.width) * 2 - 1;
          ptr.y = -((e.clientY - r.top) / r.height) * 2 + 1;

          raycaster.setFromCamera(ptr, camera);
          const hits = raycaster.intersectObjects(pressable, false);

          if (hits.length > 0 && hits[0].object.userData.role) {
            pressButton(hits[0].object.userData.role);
          }
        }
      });

      let inView = false;
      new IntersectionObserver(
        (es) => {
          inView = es[0].isIntersecting;
          if (inView) {
            currentVideo
              .play()
              .catch((e) =>
                console.log("Click the screen first to allow audio"),
              );
          } else {
            currentVideo.pause();
          }
        },
        { threshold: 0.1 },
      ).observe(canvas);

      // 7. Post Processing & Resize
      const composer = new EffectComposer(renderer);

      // Let CSS Background completely show through (alpha = 0)
      const renderPass = new RenderPass(scene, camera);
      renderPass.clearColor = new THREE.Color(0xffffff);
      renderPass.clearAlpha = 0;
      composer.addPass(renderPass);

      composer.addPass(new OutputPass());

      function fitToView() {
        if (!modelReady) return;
        const size = new THREE.Box3()
          .setFromObject(model)
          .getSize(new THREE.Vector3());

        // Now that the invisible floor is deleted, this math accurately targets the PSP!
        // Increased to 1.8 for a huge, satisfyingly large console layout.
        const fill = 0.7;

        const vFov = THREE.MathUtils.degToRad(camera.fov);
        const distH = size.y / 2 / Math.tan(vFov / 2);
        const distW = size.x / 2 / (Math.tan(vFov / 2) * camera.aspect);
        camera.position.set(0, 0, Math.max(distH, distW) / fill + size.z);
        camera.lookAt(0, 0, 0);
        camera.updateProjectionMatrix();
      }

      window.addEventListener("resize", () => {
        const w = stageContainer.clientWidth,
          h = stageContainer.clientHeight;
        renderer.setSize(w, h, false);
        composer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        fitToView();
      });

      // 8. Render Loop
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        if (!inView) return;

        const dt = Math.min(0.05, clock.getDelta());
        const t = clock.elapsedTime;

        // Apply Drag Rotation (smoothly interpolate to target)
        root.rotation.y += (dragTargetX - root.rotation.y) * 0.1;
        root.rotation.x += (dragTargetY - root.rotation.x) * 0.1;

        // Subtle Idle Movement (added on top of drag rotation)
        idleGroup.rotation.y = Math.sin(t * 1.5) * 0.05;
        idleGroup.rotation.x = Math.cos(t * 1.2) * 0.03;
        idleGroup.position.y = Math.sin(t * 2.0) * 0.08;

        crtMat.uniforms.uTime.value = t;
        crtMat.uniforms.uWarp.value *= Math.pow(0.0025, dt);
        if (crtMat.uniforms.uWarp.value < 0.001)
          crtMat.uniforms.uWarp.value = 0;

        const PRESS_DEPTH = 0.17;
        for (const k in buttons) {
          const b = buttons[k];
          if (b.t <= 0.0005) continue;
          b.t *= Math.pow(0.004, dt);
          if (b.t < 0.0005) b.t = 0;
          const d = b.axis.clone().multiplyScalar(-PRESS_DEPTH * b.t);
          b.mesh.position.copy(b.home).add(d);
        }

        if (pressLightLife > 0) {
          pressLightLife -= dt * 3.4;
          pressLight.intensity = Math.max(0, pressLightLife) * 26;
        } else {
          pressLight.intensity = 0;
        }

        composer.render();
      }
      animate();
      window.dispatchEvent(new Event("resize"));
    </script>
  </body>
</html>
