<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Interactive Scrolling Motion Graphic</title>

    <!-- Tab Icon / Favicon -->
    <link rel="icon" type="image/png" href="b1.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        overflow: hidden;
      }

      .scroll-container {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow-y: scroll;
        overflow-x: hidden;
        scroll-snap-type: y proximity;
        scroll-behavior: smooth;
      }

      .slide {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #ffffff;
      }

      /* ========================================= */
      /* --- HARDWARE ASSET CACHE ---------------- */
      /* ========================================= */
      #hardware-cache {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        z-index: -9999;
      }

      /* ========================================= */
      /* --- CUSTOM LOADER OVERLAY --------------- */
      /* ========================================= */
      #loaderOverlay {
        position: fixed;
        inset: 0;
        background: #ffffff;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .loader-content {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 120px;
        height: 120px;
      }

      .loader-ring {
        position: absolute;
        transform: rotate(-90deg);
        transition: opacity 0.3s ease;
      }

      .progress-ring {
        stroke-dasharray: 339.29;
        stroke-dashoffset: 339.29;
        transition: stroke-dashoffset 0.4s ease-out;
      }

      #loader-icon {
        width: 65px;
        height: 65px;
        object-fit: contain;
        z-index: 10000;
      }

      /* ========================================= */
      /* --- GLOBAL UI LAYER --------------------- */
      /* ========================================= */
      #ui-layer {
        position: fixed;
        inset: 0;
        z-index: 1000;
        pointer-events: none;
      }

      .corner-icon {
        position: absolute;
        bottom: clamp(20px, 5vw, 40px);
        width: 15vw;
        max-width: 110px;
        pointer-events: auto;
        cursor: pointer;
        object-fit: contain;
        transition: filter 0.1s ease;
      }

      .corner-icon:active {
        filter: brightness(0.7);
      }

      #b-icon {
        left: clamp(20px, 5vw, 40px);
        transform-origin: center;
        opacity: 0;
      }

      #cd-icon {
        right: clamp(20px, 5vw, 40px);
        transform-origin: center;
      }

      /* ========================================= */
      /* --- LIVE STREAM SUBSCRIBER COUNTER ------ */
      /* ========================================= */
      #live-sub-widget {
        position: absolute;
        right: clamp(14px, 3vw, 34px);
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        pointer-events: none;
        user-select: none;
        z-index: 1005;
        font-family: "Anton", Impact, "Arial Black", sans-serif;
        color: #000000;
      }

      .sub-stream-header {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 900;
        font-size: clamp(9px, 0.95vw, 12px);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #000000;
        margin-bottom: 2px;
      }

      .live-red-dot {
        display: none;
      }

      @keyframes livePulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.35);
          opacity: 0.45;
        }
      }

      .sub-odometer {
        display: inline-flex;
        align-items: center;
        font-family: "Anton", Impact, sans-serif;
        font-size: clamp(1.35rem, 2.6vw, 2.35rem);
        line-height: 1.05;
        color: #000000;
        letter-spacing: 0.02em;
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        padding: 4px 10px;
        border-radius: 6px;
        border-right: 4px solid #000000;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      }

      /* Keep the subscriber number clear of the centered ISHOWSPEED title on phones. */
      @media (max-width: 600px) {
        #live-sub-widget {
          top: max(12px, env(safe-area-inset-top));
          right: 10px;
          transform: none;
        }

        .sub-odometer {
          font-size: clamp(1.05rem, 5vw, 1.5rem);
          padding: 3px 7px;
          border-right-width: 3px;
        }
      }

      .odo-digit-window {
        display: inline-block;
        height: 1.05em;
        overflow: hidden;
        position: relative;
      }

      .odo-digit-ribbon {
        display: flex;
        flex-direction: column;
        will-change: transform;
        transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .odo-digit-ribbon span {
        display: block;
        height: 1.05em;
        line-height: 1.05em;
        text-align: center;
      }

      .odo-sep {
        display: inline-block;
        padding: 0 1px;
        color: #000000;
      }

      .sub-stream-footer {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 800;
        font-size: clamp(8px, 0.78vw, 10px);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(0, 0, 0, 0.65);
        margin-top: 3px;
      }

      .scroll-hint {
        position: absolute;
        bottom: clamp(20px, 4vw, 30px);
        left: 50%;
        transform: translateX(-50%);
        font-family: sans-serif;
        font-size: 14px;
        color: rgba(0, 0, 0, 0.15);
        letter-spacing: 2px;
        text-transform: uppercase;
        pointer-events: none;
        z-index: 10;
      }

      /* ========================================= */
      /* --- SLIDE 1: 2D ANIMATION STYLES -------- */
      /* ========================================= */
      .brand-text {
        position: absolute;
        font-family: Impact, "Arial Black", sans-serif;
        font-weight: 900;
        font-stretch: ultra-condensed;
        color: #ff0000;
        text-transform: uppercase;
        font-size: 13vw;
        letter-spacing: 0.05em;
        white-space: nowrap;
        user-select: none;
        z-index: 10;
        left: 50%;
        top: 50%;
        will-change: transform;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform: translate3d(-50%, -50%, 0) scaleX(0.75);
        transform-style: preserve-3d;
      }

      .car {
        position: absolute;
        height: 8vw;
        object-fit: contain;
        z-index: 20;
        left: 0;
        bottom: 0;
        will-change: transform;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform-style: preserve-3d;
        display: none;
        pointer-events: none;
      }

      .character-wrapper {
        position: absolute;
        height: 12vw;
        width: 12vw;
        z-index: 30;
        left: 0;
        bottom: 0;
        will-change: transform;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform-style: preserve-3d;
        display: none;
        pointer-events: none;
      }

      .character-wrapper img {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
      }

      .character-wrapper img.active {
        opacity: 1;
      }

      /* ========================================= */
      /* --- SLIDE 2: INTERACTIVE MARQUEE & STICKERS - */
      /* ========================================= */
      .marquee-container {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        overflow: hidden;
        pointer-events: auto;
        cursor: grab;
        z-index: 1;
        opacity: 1;
      }

      .marquee-container:active {
        cursor: grabbing;
      }

      .marquee-track {
        display: flex;
        width: max-content;
        will-change: transform;
      }

      .marquee-half {
        display: flex;
        align-items: center;
        gap: 5vw;
        padding-right: 5vw;
      }

      .marquee-half img {
        height: 15vw;
        width: 15vw;
        object-fit: contain;
        will-change: transform;
        pointer-events: none;
      }

      .anim-run1 {
        transform: translateX(-4vw) scale(1.1);
      }

      .sticker-container {
        position: relative;
        z-index: 5;
        width: 60vw;
        height: 60vw;
        max-width: 450px;
        max-height: 450px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
      }

      .sticker-img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background-color: #f0f0f0;
        border: clamp(8px, 2vw, 15px) solid #ffffff;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
        opacity: 0;
        transform: scale(1.8) rotate(0deg);
        transition:
          transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275),
          opacity 0.1s ease-out;
        pointer-events: none;
      }

      .sticker-img.show {
        opacity: 1;
      }

      /* ========================================= */
      /* --- SLIDE 3: 3D PSP CANVAS STYLES ------- */
      /* ========================================= */
      .machine__stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
      }

      #pspCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: pan-y;
        cursor: grab;
      }

      #pspCanvas:active {
        cursor: grabbing;
      }

      .hidden-audio-video {
        display: none;
      }

      .mute-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        z-index: 50;
        background: transparent;
        border: 1px solid rgba(0, 0, 0, 0.25);
        padding: 10px;
        cursor: pointer;
        border-radius: 8px;
        transition:
          background 0.2s ease,
          border-color 0.2s ease;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .mute-btn:hover {
        background: rgba(0, 0, 0, 0.04);
        border-color: rgba(0, 0, 0, 0.4);
      }

      /* ========================================= */
      /* --- SLIDE 4: GREEN APPLES & 3D GAP.GLB -- */
      /* ========================================= */
      #slide-4-wrapper {
        position: relative;
        width: 100vw;
        height: 560vh;
        height: 560dvh;
        scroll-snap-align: start;
        background-color: #ffffff;
      }

      #slide-4-sticky {
        position: sticky;
        top: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #ffffff;
        touch-action: pan-y;
      }

      .green-apple-text {
        position: absolute;
        top: 50%;
        left: 0;
        font-family:
          "Anton", Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        font-size: clamp(7rem, 26vw, 12cm);
        font-weight: 400;
        line-height: 0.84;
        letter-spacing: -0.025em;
        white-space: nowrap;
        text-transform: uppercase;
        color: #000000;
        -webkit-text-stroke: 0px transparent;
        text-shadow: none;
        user-select: none;
        pointer-events: none;
        z-index: 10;
        will-change: transform, opacity;
        transform: translate3d(110vw, -50%, 0);
      }

      #appleCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
        z-index: 20;
        will-change: opacity;
      }

      .gif-ring-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible;
        perspective: 1200px;
        transform-style: preserve-3d;
      }

      #gifRingBack {
        z-index: 15;
      }

      #gifRingFront {
        z-index: 25;
      }

      /* Curved Multi-Slice GIF Container */
      .saturn-gif-item {
        position: absolute;
        top: 50%;
        left: 50%;
        width: clamp(96px, 12.6vw, 178px);
        height: clamp(66px, 8.5vw, 118px);
        user-select: none;
        pointer-events: none;
        will-change: transform, opacity;
        opacity: 1;
        visibility: visible;
        transform-style: preserve-3d;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.22));
      }

      .gif-curve-slice {
        position: absolute;
        top: 0;
        height: 100%;
        background-repeat: no-repeat;
        backface-visibility: visible;
        transform-style: preserve-3d;
        will-change: transform;
      }

      #slide-4-sticky.ring-interactive {
        cursor: grab;
      }

      #slide-4-sticky.ring-interactive.ring-dragging {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <!-- Hardware Asset Cache -->
    <div id="hardware-cache"></div>

    <!-- Audio / Video Assets -->
    <video
      id="video1"
      class="hidden-audio-video"
      src="video1.mp4"
      loop
      muted
      playsinline
      crossorigin="anonymous"
    ></video>
    <video
      id="video2"
      class="hidden-audio-video"
      src="video2.mp4"
      loop
      muted
      playsinline
      crossorigin="anonymous"
    ></video>
    <audio id="b-audio" class="hidden-audio-video" src="b.mp3"></audio>
    <audio id="wc-audio" class="hidden-audio-video" src="wc.mp3" loop></audio>

    <!-- Custom Loading Overlay -->
    <div id="loaderOverlay">
      <div class="loader-content">
        <svg class="loader-ring" width="120" height="120" viewBox="0 0 120 120">
          <circle
            cx="60"
            cy="60"
            r="54"
            fill="none"
            stroke="#eeeeee"
            stroke-width="6"
          />
          <circle
            class="progress-ring"
            id="progressRing"
            cx="60"
            cy="60"
            r="54"
            fill="none"
            stroke="#ff0000"
            stroke-width="6"
            stroke-linecap="round"
          />
        </svg>
        <img src="6.png" id="loader-icon" alt="loading" />
      </div>
    </div>

    <!-- Global Fixed UI Overlay -->
    <div id="ui-layer">
      <img src="6.png" id="b-icon" class="corner-icon" alt="Effect Icon" />
      <img src="cd.png" id="cd-icon" class="corner-icon" alt="CD Icon" />

      <!-- Live IShowSpeed YouTube Subscriber Stream Counter -->
      <div id="live-sub-widget" aria-label="IShowSpeed Live Subscribers">
        <div class="sub-odometer" id="subOdometer"></div>
      </div>
    </div>

    <main class="scroll-container" id="scrollContainer">
      <!-- SLIDE 1 -->
      <section class="slide" id="slide-1">
        <div class="brand-text" id="brandText">ISHOWSPEED</div>
        <img src="5.png" alt="Red Sports Car" class="car" id="carImg" />

        <div class="character-wrapper" id="charWrap">
          <img src="1.png" id="pose-1" class="active" />
          <img src="2.png" id="pose-2" />
          <img src="3.png" id="pose-3" />
          <img src="4.png" id="pose-4" />
        </div>

        <div class="scroll-hint">Scroll &darr;</div>
      </section>

      <!-- SLIDE 2 -->
      <section class="slide" id="slide-2">
        <div class="marquee-container" id="marqueeDrag">
          <div class="marquee-track" id="marqueeTrack">
            <!-- Set 1 -->
            <div class="marquee-half" id="marqueeHalf">
              <img src="p.png" alt="trail" />
              <img src="crboy.png" alt="trail" />
              <img src="ksi.png" alt="trail" />
              <img src="drum1.png" class="anim-drum" alt="trail" />
              <img src="r1.png" class="anim-r" alt="trail" />
              <img src="face.png" alt="trail" />
              <img src="messi.png" alt="trail" />
              <img src="run1s.png" class="anim-run" alt="trail" />
              <img src="ney.png" alt="trail" />
              <img src="prime.png" alt="trail" />
              <img src="eat.png" alt="trail" />
              <img src="boom.png" alt="trail" />
              <img src="bal.png" alt="trail" />
              <img src="ben1.png" class="anim-ben" alt="trail" />
              <img src="crmeet.png" alt="trail" />
              <img src="i1.png" alt="trail" />
              <img src="kunfu.png" alt="trail" />
              <img src="goal.png" alt="trail" />
              <img src="ballon.png" alt="trail" />
              <img src="60m.png" alt="trail" />
              <img src="kai.png" alt="trail" />
            </div>
            <!-- Duplicate for infinite looping -->
            <div class="marquee-half">
              <img src="p.png" alt="trail" />
              <img src="crboy.png" alt="trail" />
              <img src="ksi.png" alt="trail" />
              <img src="drum1.png" class="anim-drum" alt="trail" />
              <img src="r1.png" class="anim-r" alt="trail" />
              <img src="face.png" alt="trail" />
              <img src="messi.png" alt="trail" />
              <img src="run1s.png" class="anim-run" alt="trail" />
              <img src="ney.png" alt="trail" />
              <img src="prime.png" alt="trail" />
              <img src="eat.png" alt="trail" />
              <img src="boom.png" alt="trail" />
              <img src="bal.png" alt="trail" />
              <img src="ben1.png" class="anim-ben" alt="trail" />
              <img src="crmeet.png" alt="trail" />
              <img src="i1.png" alt="trail" />
              <img src="kunfu.png" alt="trail" />
              <img src="goal.png" alt="trail" />
              <img src="ballon.png" alt="trail" />
              <img src="60m.png" alt="trail" />
              <img src="kai.png" alt="trail" />
            </div>
          </div>
        </div>
        <div class="sticker-container" id="stickerContainer"></div>
        <div class="scroll-hint">Scroll &darr;</div>
      </section>

      <!-- SLIDE 3 (PSP) -->
      <section class="slide" id="slide-3">
        <div class="machine__stage" id="stageContainer">
          <canvas id="pspCanvas"></canvas>
          <button id="muteBtn" class="mute-btn">
            <svg
              viewBox="0 0 24 24"
              width="24"
              height="24"
              stroke="rgba(0,0,0,0.6)"
              stroke-width="2"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>
        </div>
        <div class="scroll-hint">Scroll &darr;</div>
      </section>

      <!-- SLIDE 4: Green Apples + 3D gap.glb + Connected Curved Bottle-Cap Ring of 1.gif-11.gif -->
      <section id="slide-4-wrapper">
        <div id="slide-4-sticky">
          <div class="green-apple-text" id="greenAppleText">GREEN APPLES</div>
          <div class="gif-ring-layer" id="gifRingBack"></div>
          <canvas id="appleCanvas"></canvas>
          <div class="gif-ring-layer" id="gifRingFront"></div>
        </div>
      </section>
    </main>

    <!-- ========================================================= -->
    <!-- SCRIPT 1: REAL ASSET LOADER -->
    <!-- ========================================================= -->
    <script>
      const stickerImages = [
        "8.jpeg",
        "9.jpg",
        "11.jpg",
        "12.jpg",
        "13.jpg",
        "14.jpg",
        "15.jpg",
        "16.jpg",
        "17.jpg",
        "18.jpg",
        "19.jpg",
        "20.jpg",
        "21.jpg",
        "22.jpg",
        "23.jpg",
        "24.jpeg",
      ];

      const marqueeImages = [
        "crboy.png",
        "crmeet.png",
        "ksi.png",
        "kai.png",
        "face.png",
        "messi.png",
        "ney.png",
        "prime.png",
        "eat.png",
        "boom.png",
        "bal.png",
        "i1.png",
        "kunfu.png",
        "goal.png",
        "drum1.png",
        "drum2.png",
        "r1.png",
        "r2.png",
        "run1s.png",
        "run2s.png",
        "ben1.png",
        "ben2.png",
        "ballon.png",
        "60m.png",
      ];

      const allImages = [
        "1.png",
        "2.png",
        "3.png",
        "4.png",
        "5.png",
        "p.png",
        "6.png",
        "7.png",
        "cd.png",
        "b1.png",
        ...stickerImages,
        ...marqueeImages,
      ];

      const totalAssets = allImages.length + 1;
      let loadedAssets = 0;
      let loadingFinished = false;
      let loaderFailsafeTimer;

      const loaderOverlay = document.getElementById("loaderOverlay");
      const loaderIcon = document.getElementById("loader-icon");
      const progressRing = document.getElementById("progressRing");
      const loaderRingSvg = document.querySelector(".loader-ring");
      const realBIcon = document.getElementById("b-icon");
      const hardwareCache = document.getElementById("hardware-cache");
      const circ = 339.29;

      window.UPDATE_REAL_PROGRESS = function () {
        loadedAssets++;
        let percent = (loadedAssets / totalAssets) * 100;
        progressRing.style.strokeDashoffset = circ - (circ * percent) / 100;

        if (loadedAssets >= totalAssets) {
          finalizeLoading();
        }
      };

      allImages.forEach((src) => {
        const img = new Image();
        img.onload = window.UPDATE_REAL_PROGRESS;
        img.onerror = window.UPDATE_REAL_PROGRESS;
        img.src = src;
        hardwareCache.appendChild(img);
      });

      let isSix = true;
      const toggleInt = setInterval(() => {
        isSix = !isSix;
        loaderIcon.src = isSix ? "6.png" : "7.png";
      }, 200);

      // Never leave the page trapped behind the loader if a CDN or 3D asset fails.
      loaderFailsafeTimer = setTimeout(() => {
        console.warn(
          "Loading took too long. Starting the available parts of the experience.",
        );
        finalizeLoading();
      }, 12000);

        let vw,

          const progress = Math.min(elapsed / totalDuration, 1.0);

          let carX = carStartX;
          let textTranslateX = 0;
          let charBottomOffset = baselineBottom;
          let charX = charRestX;
          let currentPose = 1;

            const endCarX = -carWidth - vw * 0.1;
            const easeP = (x) =>
              x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;

          const jumpStart = 0.3;
          const jumpEnd = 0.65;

          if (progress >= jumpStart && progress <= jumpEnd) {
            const jumpP = (progress - jumpStart) / (jumpEnd - jumpStart);
            const arc = Math.pow(Math.sin(jumpP * Math.PI), 0.4);

            charBottomOffset = baselineBottom + arc * maxJumpHeight;
            charX = charRestX + jumpP * jumpDistance;

            if (jumpP < 0.2) currentPose = 1;
            else if (jumpP < 0.5) currentPose = 2;
            else if (jumpP < 0.8) currentPose = 3;
            else currentPose = 4;

            charBottomOffset = baselineBottom;
            charX = charTargetX;

              .getElementById(`pose-${lastPose}`)

              .getElementById(`pose-${currentPose}`)

            requestAnimationFrame(updateAnimation);

                    vec2 c = uv - 0.5;
                    float r2 = dot(c, c);
                    uv = 0.5 + c * (1.0 + 0.032 * r2);
                    float band = step(0.5, hash(vec2(floor(uv.y * 26.0), floor(uTime * 22.0))));
                    uv.x += uWarp * (band - 0.5) * 0.09;

                    if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
                        gl_FragColor = vec4(0.005, 0.008, 0.013, 1.0);
                        return;
                    }
                    vec2 g = uGrid;
                    vec2 quv = (floor(uv * g) + 0.5) / g;
                    float ab = (0.0005 + 0.0035 * r2) * (1.0 + uWarp * 6.0);
                    float rr = texture2D(uTex, vec2(quv.x + ab, quv.y)).r;
                    float gg = texture2D(uTex, quv).g;
                    float bb = texture2D(uTex, vec2(quv.x - ab, quv.y)).b;
                    vec3 col = vec3(rr, gg, bb);
                    float sub = mod(floor(uv.x * g.x * 3.0), 3.0);
                    vec3 mask = vec3(sub < 1.0 ? 1.0 : 0.90, (sub >= 1.0 && sub < 2.0) ? 1.0 : 0.90, sub >= 2.0 ? 1.0 : 0.90);
                    col *= mask;
                    float scan = 0.93 + 0.07 * cos(uv.y * g.y * 6.28318);
                    col *= scan;
                    col += vec3(0.05, 0.075, 0.10) * pow(1.0 - uv.y, 3.0) * 0.45;
                    col *= 1.0 - 0.30 * pow(r2 * 1.55, 1.6);
                    col += (hash(quv * 620.0) - 0.5) * 0.012;
                    float open = smoothstep(0.0, 1.0, uPower);
                    float slit = smoothstep(open * 0.62 + 0.002, 0.0, abs(uv.y - 0.5));
                    col = mix(vec3(0.55, 0.85, 1.0) * slit * 2.4, col, open);
                    col *= open;

                    gl_FragColor = vec4(col * uBright, 1.0);
                }`,
      });

      let screenMesh = null;
      const buttons = {};
      const pressable = [];

      new GLTFLoader().load(
        "psp.glb",
        (gltf) => {
          model.add(gltf.scene);
          gltf.scene.updateWorldMatrix(true, true);

          const bin = [];
          gltf.scene.traverse((o) => {
            if (!o.isMesh) return;
            const n = o.name.toLowerCase();

            if (n.includes("ground")) {
              bin.push(o);
              return;
            }
            if (n.includes("screen") || n.includes("display")) {
              screenMesh = o;
              o.material = crtMat;
            }
            const m = n.match(/^button(\d+)/);
            if (m || n.includes("button")) {
              let role = n;
              if (n.includes("left") || n.includes("dpad_l")) role = "left";
              if (n.includes("right") || n.includes("dpad_r")) role = "right";
              if (n.includes("cross") || n.includes("x")) role = "cross";
              if (n.includes("circle") || n.includes("o")) role = "circle";
              mapButton(role, o);
            }
          });

          bin.forEach((o) => {
            o.parent && o.parent.remove(o);
          });

          if (screenMesh) {
            const sNrm = largestFaceNormal(screenMesh);
            if (sNrm.z < 0) sNrm.negate();
            buildScreenUVs(
              screenMesh,
              sNrm,
              new THREE.Vector3(1, 0, 0),
              new THREE.Vector3(0, 1, 0),
            );
          }

          const size = new THREE.Box3()
            .setFromObject(model)
            .getSize(new THREE.Vector3());
          model.scale.setScalar(10 / Math.max(size.x, size.y, size.z));
          model.updateWorldMatrix(true, true);
          model.position.sub(
            new THREE.Box3()
              .setFromObject(model)
              .getCenter(new THREE.Vector3()),
          );

          fitToView();

          if (window.UPDATE_REAL_PROGRESS) window.UPDATE_REAL_PROGRESS();
        },
        undefined,
        (err) => {
          console.error("Failed to load psp.glb", err);
          if (window.UPDATE_REAL_PROGRESS) window.UPDATE_REAL_PROGRESS();
        },
      );

      function mapButton(role, mesh) {
        const parent = mesh.parent || model;
        const pq = new THREE.Quaternion();
        parent.getWorldQuaternion(pq);
        const ps = new THREE.Vector3();
        parent.getWorldScale(ps);
        const axis = new THREE.Vector3(0, 0, 1).applyQuaternion(pq.invert());
        axis.set(
          axis.x / (ps.x || 1),
          axis.y / (ps.y || 1),
          axis.z / (ps.z || 1),
        );

        buttons[role] = { role, mesh, home: mesh.position.clone(), axis, t: 0 };
        mesh.userData.role = role;
        pressable.push(mesh);
      }

      const raycaster = new THREE.Raycaster();
      const ptr = new THREE.Vector2();

      let isDragging = false;
      let startTouchX = 0;
      let startTouchY = 0;
      let dragTargetX = 0;
      let dragTargetY = 0;
      let previousMousePosition = { x: 0, y: 0 };

      pspCanvas.addEventListener("pointerdown", (e) => {
        isDragging = true;
        startTouchX = e.clientX;
        startTouchY = e.clientY;
        previousMousePosition = { x: e.clientX, y: e.clientY };
        pspCanvas.setPointerCapture(e.pointerId);
      });

      pspCanvas.addEventListener("pointermove", (e) => {
        if (isDragging) {
          const deltaX = e.clientX - previousMousePosition.x;
          const deltaY = e.clientY - previousMousePosition.y;

          dragTargetX += deltaX * 0.006;
          dragTargetY += deltaY * 0.006;
          dragTargetY = Math.max(-0.6, Math.min(0.6, dragTargetY));

          previousMousePosition = { x: e.clientX, y: e.clientY };
        }
      });

      function pressButton(role) {
        const b = buttons[role];
        if (b) {
          b.t = 1;
          const wp = new THREE.Box3()
            .setFromObject(b.mesh)
            .getCenter(new THREE.Vector3());
          pressLight.position.copy(wp).add(new THREE.Vector3(0, 0, 1.4));
          pressLight.color.set(0x7fe3ff);
          pressLightLife = 1;
        }

        if (currentVideo === video1) {
          video1.pause();
          video2.currentTime = 0;
          video2.play();
          currentVideo = video2;
          crtMat.uniforms.uTex.value = videoTex2;
        } else {
          video2.pause();
          video1.currentTime = 0;
          video1.play();
          currentVideo = video1;
          crtMat.uniforms.uTex.value = videoTex1;
        }

        crtMat.uniforms.uWarp.value = 1.0;
      }

      pspCanvas.addEventListener("click", (e) => {
        const dragDistance =
          Math.abs(e.clientX - startTouchX) + Math.abs(e.clientY - startTouchY);

        if (dragDistance < 10) {
          const r = pspCanvas.getBoundingClientRect();
          ptr.x = ((e.clientX - r.left) / r.width) * 2 - 1;
          ptr.y = -((e.clientY - r.top) / r.height) * 2 + 1;

          raycaster.setFromCamera(ptr, camera);
          const hits = raycaster.intersectObjects(pressable, false);

          if (hits.length > 0 && hits[0].object.userData.role) {
            pressButton(hits[0].object.userData.role);
          }
        }
      });

      pspCanvas.addEventListener("pointerup", (e) => {
        isDragging = false;
        pspCanvas.releasePointerCapture(e.pointerId);
      });

      let pspInView = false;
      const videoObserver = new IntersectionObserver(
        (es) => {
          pspInView = es[0].isIntersecting;
          if (es[0].isIntersecting) {
            currentVideo.play().catch((e) => {});
          } else {
            currentVideo.pause();
          }
        },
        { root: scrollContainer, threshold: 0.01 },
      );
      videoObserver.observe(pspCanvas);

      const composer = new EffectComposer(renderer);
      const renderPass = new RenderPass(scene, camera);
      renderPass.clearColor = new THREE.Color(0xffffff);
      renderPass.clearAlpha = 0;
      composer.addPass(renderPass);
      composer.addPass(new OutputPass());

      function fitToView() {
        if (!model.children.length) return;
        const size = new THREE.Box3()
          .setFromObject(model)
          .getSize(new THREE.Vector3());
        if (size.x === 0 || size.y === 0) return;

        const fill = 0.7;
        const vFov = THREE.MathUtils.degToRad(camera.fov);
        const distH = size.y / 2 / Math.tan(vFov / 2);
        const distW = size.x / 2 / (Math.tan(vFov / 2) * camera.aspect);
        camera.position.set(0, 0, Math.max(distH, distW) / fill + size.z);
        camera.lookAt(0, 0, 0);
        camera.updateProjectionMatrix();
      }

      window.addEventListener("resize", () => {
        const w = stageContainer.clientWidth,
          h = stageContainer.clientHeight;
        if (w === 0 || h === 0) return;
        renderer.setSize(w, h, false);
        composer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        fitToView();
      });

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        if (document.hidden || !pspInView) return;

        const dt = Math.min(0.05, clock.getDelta());
        const t = clock.elapsedTime;

        root.rotation.y += (dragTargetX - root.rotation.y) * 0.1;
        root.rotation.x += (dragTargetY - root.rotation.x) * 0.1;

        idleGroup.rotation.y = Math.sin(t * 1.5) * 0.05;
        idleGroup.rotation.x = Math.cos(t * 1.2) * 0.03;
        idleGroup.position.y = Math.sin(t * 2.0) * 0.08;

        crtMat.uniforms.uTime.value = t;
        crtMat.uniforms.uWarp.value *= Math.pow(0.0025, dt);
        if (crtMat.uniforms.uWarp.value < 0.001)
          crtMat.uniforms.uWarp.value = 0;

        const PRESS_DEPTH = 0.17;
        for (const k in buttons) {
          const b = buttons[k];
          if (b.t <= 0.0005) continue;
          b.t *= Math.pow(0.004, dt);
          if (b.t < 0.0005) b.t = 0;
          const d = b.axis.clone().multiplyScalar(-PRESS_DEPTH * b.t);
          b.mesh.position.copy(b.home).add(d);
        }

        if (pressLightLife > 0) {
          pressLightLife -= dt * 3.4;
          pressLight.intensity = Math.max(0, pressLightLife) * 26;
        } else {
          pressLight.intensity = 0;
        }

        composer.render();
      }
      animate();
      window.dispatchEvent(new Event("resize"));
      requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));

      // =====================================================
      // SLIDE 4: GREEN APPLES + GAP.GLB + SEQUENTIAL ONE-SIDE CURVED BOTTLE-CAP GIF RING + FINAL ZOOM-IN
      // =====================================================
      const slide4Wrapper = document.getElementById("slide-4-wrapper");
      const slide4Sticky = document.getElementById("slide-4-sticky");
      const greenAppleText = document.getElementById("greenAppleText");
      const appleCanvas = document.getElementById("appleCanvas");
      const gifRingBack = document.getElementById("gifRingBack");
      const gifRingFront = document.getElementById("gifRingFront");
      const scrollContainerEl = document.getElementById("scrollContainer");

      // Create 1.gif to 11.gif as multi-slice curved cylindrical panels so each GIF itself is physically curvy
      const TOTAL_RING_GIFS = 11;
      const SLICES_PER_GIF = 11;
      const gifRingItems = [];

      for (let i = 1; i <= TOTAL_RING_GIFS; i++) {
        const container = document.createElement("div");
        container.className = "saturn-gif-item";

        const slices = [];
        for (let s = 0; s < SLICES_PER_GIF; s++) {
          const slice = document.createElement("div");
          slice.className = "gif-curve-slice";
          const sliceWidthPct = 100 / SLICES_PER_GIF;
          const bgPosPct =
            SLICES_PER_GIF > 1 ? (s / (SLICES_PER_GIF - 1)) * 100 : 50;

          slice.style.width = `calc(${sliceWidthPct.toFixed(4)}% + 1.5px)`;
          slice.style.left = `${(s * sliceWidthPct).toFixed(4)}%`;
          slice.style.backgroundImage = `url("${i}.gif")`;
          slice.style.backgroundSize = `${SLICES_PER_GIF * 100}% 100%`;
          slice.style.backgroundPosition = `${bgPosPct.toFixed(3)}% 50%`;

          if (s === 0) {
            slice.style.borderTopLeftRadius = "6px";
            slice.style.borderBottomLeftRadius = "6px";
          } else if (s === SLICES_PER_GIF - 1) {
            slice.style.borderTopRightRadius = "6px";
            slice.style.borderBottomRightRadius = "6px";
          }

          container.appendChild(slice);
          slices.push(slice);
        }

        gifRingFront.appendChild(container);
        gifRingItems.push({
          el: container,
          slices,
          index: i - 1,
          inFront: true,
        });
      }

      const appleRenderer = new THREE.WebGLRenderer({
        canvas: appleCanvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance",
      });
      appleRenderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio || 1,
          window.innerWidth < 768 ? 1.25 : 1.5,
        ),
      );
      appleRenderer.toneMapping = THREE.ACESFilmicToneMapping;
      appleRenderer.toneMappingExposure = 1.15;
      appleRenderer.outputColorSpace = THREE.SRGBColorSpace;
      appleRenderer.setClearColor(0xffffff, 0);

      const appleScene = new THREE.Scene();
      const appleCamera = new THREE.PerspectiveCamera(
        35,
        window.innerWidth / window.innerHeight,
        0.1,
        500,
      );
      appleCamera.position.set(0, 0, 26);

      const appleHemi = new THREE.HemisphereLight(0xffffff, 0x223322, 1.9);
      appleScene.add(appleHemi);

      const appleDirLight = new THREE.DirectionalLight(0xffffff, 2.4);
      appleDirLight.position.set(10, 15, 18);
      appleScene.add(appleDirLight);

      const appleRimLight = new THREE.DirectionalLight(0x76ff03, 2.0);
      appleRimLight.position.set(-14, -8, 10);
      appleScene.add(appleRimLight);

      const appleRoot = new THREE.Group();
      const appleModelHolder = new THREE.Group();
      appleRoot.add(appleModelHolder);
      appleScene.add(appleRoot);

      let appleModelHalfWidthUnits = 1.85;

      const appleGltfLoader = new GLTFLoader();
      appleGltfLoader.load(
        "gap.glb",
        (gltf) => {
          gltf.scene.traverse((child) => {
            if (child.isMesh && child.material) {
              const mats = Array.isArray(child.material)
                ? child.material
                : [child.material];
              mats.forEach((m) => {
                m.transparent = false;
                m.opacity = 1.0;
                m.depthWrite = true;
                m.depthTest = true;
                m.alphaTest = 0;
                if ("transmission" in m) m.transmission = 0;
                m.side = THREE.DoubleSide;
                m.needsUpdate = true;
              });
            }
          });

          appleModelHolder.add(gltf.scene);
          gltf.scene.updateWorldMatrix(true, true);

          const box = new THREE.Box3().setFromObject(appleModelHolder);
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z) || 1;
          appleModelHolder.scale.setScalar(5.5 / maxDim);
          appleModelHolder.updateWorldMatrix(true, true);

          const centeredBox = new THREE.Box3().setFromObject(appleModelHolder);
          const center = centeredBox.getCenter(new THREE.Vector3());
          const scaledSize = centeredBox.getSize(new THREE.Vector3());
          appleModelHolder.position.sub(center);

          const minRadius =
            Math.min(scaledSize.x, scaledSize.y, scaledSize.z) * 0.24;
          appleModelHalfWidthUnits =
            Math.max(scaledSize.x, scaledSize.z) * 0.42;

          const tinyInnerCore = new THREE.Mesh(
            new THREE.SphereGeometry(minRadius, 24, 24),
            new THREE.MeshBasicMaterial({
              color: 0x2e6b12,
              transparent: false,
              opacity: 1.0,
              depthWrite: true,
            }),
          );
          appleRoot.add(tinyInnerCore);
        },
        undefined,
        (err) => {
          console.warn(
            "Optional slide 4 model gap.glb could not be loaded. Check that the file is committed beside index.html with matching capitalization.",
            err,
          );
          appleCanvas.style.display = "none";
        },
      );

      let slide4InView = false;
      new IntersectionObserver(
        (entries) => {
          slide4InView = entries[0].isIntersecting;
        },
        { root: scrollContainerEl, threshold: 0.01 },
      ).observe(slide4Wrapper);

      let targetAppleProgress = 0;
      let smoothAppleProgress = 0;

      // Bottle-cap ring & apple manual rotation state (smooth inertia)
      let ringSpinAngle = 0;
      let ringAngularVelocity = 0;
      let manualAppleYawOffset = 0;
      let appleAccumulatedYaw = 0;
      let currentAppleSpinRate = 2.4;
      let isSpinningRing = false;
      let activeRingPointerId = null;
      let prevPointerX = 0;
      let prevPointerY = 0;

      slide4Sticky.addEventListener("pointerdown", (e) => {
        if (smoothAppleProgress < 0.44) return;
        isSpinningRing = true;
        activeRingPointerId = e.pointerId;
        prevPointerX = e.clientX;
        prevPointerY = e.clientY;
        slide4Sticky.classList.add("ring-dragging");
      });

      window.addEventListener("pointermove", (e) => {
        if (!isSpinningRing || e.pointerId !== activeRingPointerId) return;
        const dx = e.clientX - prevPointerX;
        const dy = e.clientY - prevPointerY;
        prevPointerX = e.clientX;
        prevPointerY = e.clientY;

        const spinDelta =
          (dx * 0.0085 - dy * 0.002) *
          (e.clientY >= window.innerHeight * 0.5 ? 1 : -0.7);
        ringSpinAngle += spinDelta;
        manualAppleYawOffset -= spinDelta * 0.85;
        ringAngularVelocity = spinDelta * 0.9;
      });

      function endRingPointerDrag(e) {
        if (!isSpinningRing) return;
        if (
          e &&
          activeRingPointerId !== null &&
          e.pointerId !== activeRingPointerId
        )
          return;
        isSpinningRing = false;
        activeRingPointerId = null;
        slide4Sticky.classList.remove("ring-dragging");
      }

      window.addEventListener("pointerup", endRingPointerDrag);
      window.addEventListener("pointercancel", endRingPointerDrag);

      function computeSlide4ScrollProgress() {
        const wrapperTop = slide4Wrapper.offsetTop;
        const scrollableDistance =
          slide4Wrapper.offsetHeight - scrollContainerEl.clientHeight;
        const currentScroll = scrollContainerEl.scrollTop;
        if (scrollableDistance <= 0) return 0;

        const entryBuffer = scrollContainerEl.clientHeight * 0.3;
        const rawProgress =
          (currentScroll - (wrapperTop - entryBuffer)) /
          (scrollableDistance + entryBuffer);
        return Math.max(0, Math.min(1, rawProgress));
      }

      scrollContainerEl.addEventListener("scroll", () => {
        targetAppleProgress = computeSlide4ScrollProgress();
      });

      function smoothstep(edge0, edge1, x) {
        const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }

      function updateSlide4Animation(p, elapsedTime, dt) {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const textWidth = greenAppleText.offsetWidth || vw * 1.5;

        const vFov = THREE.MathUtils.degToRad(appleCamera.fov);
        const visibleHeight = 2 * Math.tan(vFov / 2) * appleCamera.position.z;
        const visibleWidth = visibleHeight * appleCamera.aspect;

        // -----------------------------------------------------------
        // 1. FIRST HALF (0.00 -> 0.45): GREEN APPLES text + Apple Strike & Rebound to Middle
        // -----------------------------------------------------------
        const textPhase = Math.min(p / 0.44, 1.0);
        const startTextX = vw + vw * 0.08;
        const endTextX = -textWidth - vw * 0.15;
        const currentTextX = startTextX + (endTextX - startTextX) * textPhase;

        greenAppleText.style.transform = `translate3d(${currentTextX}px, -50%, 0)`;
        greenAppleText.style.opacity =
          p > 0.42 ? Math.max(0, 1 - (p - 0.42) / 0.05) : 1;

        const leftWallX = -visibleWidth * 0.41;
        const rightStartX = visibleWidth * 0.72;

        let appleX = rightStartX;
        let appleScaleX = 0.85;
        let appleScaleY = 0.85;
        let appleScaleZ = 0.85;

        // FINAL ZOOM-IN OUT OF THE SCREEN (p > 0.78):
        // Instead of zooming out small, both the apple and the curved GIF ring grow bigger and bigger and rush past the screen!
        const zoomInPhase = p > 0.78 ? (p - 0.78) / (1.0 - 0.78) : 0;
        const zoomInCurve = Math.pow(zoomInPhase, 2.15);
        const sceneZoomInMultiplier = 1.0 + 13.5 * zoomInCurve;
        const sceneFadeOut =
          p > 0.93 ? Math.max(0, 1 - (p - 0.93) / 0.07) : 1.0;

        if (p <= 0.29) {
          const followP = Math.max(0, (p - 0.03) / (0.29 - 0.03));
          const moveEase = 1 - Math.pow(1 - followP, 1.65);
          appleX = rightStartX + (leftWallX - rightStartX) * moveEase;

          const baseScale = 0.55 + 0.45 * moveEase;
          const strikeImpact = Math.exp(-Math.pow((p - 0.29) / 0.024, 2));
          appleScaleX = baseScale * (1 - 0.24 * strikeImpact);
          appleScaleY = baseScale * (1 + 0.18 * strikeImpact);
          appleScaleZ = baseScale * (1 + 0.12 * strikeImpact);
        } else if (p <= 0.45) {
          const reboundP = (p - 0.29) / (0.45 - 0.29);
          const easeOutBack = 1 - Math.pow(1 - reboundP, 2.4);
          appleX = leftWallX * (1 - easeOutBack);
          const midScale = 1.0 + 1.15 * easeOutBack;
          const strikeImpact = Math.exp(-Math.pow((p - 0.29) / 0.025, 2));
          appleScaleX = midScale * (1 - 0.24 * strikeImpact);
          appleScaleY = midScale * (1 + 0.18 * strikeImpact);
          appleScaleZ = midScale * (1 + 0.12 * strikeImpact);
        } else {
          // Apple stays centered in the middle and scales up huge out of the screen at the end
          appleX = 0;
          // On phones, leave more breathing room between the apple and the GIF ribbon.
          const mobileAppleScale = vw <= 600 ? 1.45 : 2.15;
          const steadyScale = mobileAppleScale * sceneZoomInMultiplier;
          appleScaleX = steadyScale;
          appleScaleY = steadyScale;
          appleScaleZ = steadyScale;
        }

        // -----------------------------------------------------------
        // 2. APPLE STRAIGHTENING & SMOOTH DIRECTION REVERSAL IN THE MIDDLE
        // -----------------------------------------------------------
        const straightenFactor = 1 - smoothstep(0.31, 0.45, p);
        const naturalTiltX =
          Math.sin(p * Math.PI * 5) * 0.35 * straightenFactor;
        const naturalTiltZ = p * Math.PI * 2.2 * straightenFactor;

        // Once the sequential one-side wrap completes (around p = 0.66),
        // smoothly reverse the apple's rotation direction while staying in the middle
        const reverseBlend = smoothstep(0.64, 0.73, p);
        const targetSpinRate = 2.5 * (1 - 2.0 * reverseBlend);
        currentAppleSpinRate +=
          (targetSpinRate - currentAppleSpinRate) * Math.min(1, dt * 6);
        appleAccumulatedYaw += currentAppleSpinRate * dt;

        const peakP = 0.66;
        const scrollYaw =
          p <= peakP
            ? -p * Math.PI * 7.0
            : -peakP * Math.PI * 7.0 +
              smoothstep(peakP, 0.85, p) * (p - peakP) * Math.PI * 7.0;

        appleRoot.position.x = appleX;
        appleRoot.position.y = Math.sin(elapsedTime * 2.2) * 0.07;
        appleRoot.scale.set(appleScaleX, appleScaleY, appleScaleZ);
        appleRoot.rotation.x = naturalTiltX;
        appleRoot.rotation.z = naturalTiltZ;
        appleRoot.rotation.y =
          scrollYaw + appleAccumulatedYaw + manualAppleYawOffset;

        appleCanvas.style.opacity = sceneFadeOut;

        // -----------------------------------------------------------
        // 3. SEQUENTIAL ONE-SIDE WRAPPING OF CURVED GIFS (1.gif -> 11.gif)
        // -----------------------------------------------------------
        // Begin showing the GIF ribbon earlier and give it enough scroll distance
        // to complete the wrap, rather than leaving it hidden until late in the slide.
        const ringEntryProgress = Math.max(0, Math.min(1, (p - 0.34) / 0.30));
        const isFullyWrapped = ringEntryProgress >= 0.995;

        if (ringEntryProgress > 0.01 && sceneFadeOut > 0.05) {
          slide4Sticky.classList.add("ring-interactive");
        } else {
          slide4Sticky.classList.remove("ring-interactive");
        }

        // Only start continuous ring orbit AFTER the sequential one-side wrap finishes covering the apple,
        // so the entry itself feeds cleanly from the right side only!
        if (!isSpinningRing) {
          if (isFullyWrapped) {
            const ringDirection = -1 + 2.0 * reverseBlend;
            const autoOrbitSpeed = 1.45 * ringDirection;
            ringSpinAngle += autoOrbitSpeed * dt + ringAngularVelocity;
          } else {
            ringSpinAngle += ringAngularVelocity;
          }
          manualAppleYawOffset -= ringAngularVelocity * 0.45;
          ringAngularVelocity *= Math.pow(0.035, dt);
          if (Math.abs(ringAngularVelocity) < 0.00005) ringAngularVelocity = 0;
        }

        const appleScreenOffsetX = (appleX / (visibleWidth * 0.5)) * (vw * 0.5);
        const appleScreenOffsetY =
          -(appleRoot.position.y / (visibleHeight * 0.5)) * (vh * 0.5);

        // Unzoomed apple pixel radius for base ring proportions
        const baseApplePixelRadius =
          ((appleModelHalfWidthUnits * 2.15) / (visibleWidth * 0.5)) *
          (vw * 0.5);
        const currentApplePixelRadius =
          baseApplePixelRadius * sceneZoomInMultiplier;

        // Clear gap between the apple and the surrounding bottle-cap GIF ring
        const rawRadiusX = Math.max(
          baseApplePixelRadius * 2.22,
          Math.min(vw * 0.37, 435),
        );
        const baseRadiusX = rawRadiusX * sceneZoomInMultiplier;
        const baseRadiusY =
          Math.min(vh * 0.09, rawRadiusX * 0.24) * sceneZoomInMultiplier;

        const capTiltDeg = -12;
        const capTiltRad = capTiltDeg * (Math.PI / 180);
        const cosTilt = Math.cos(capTiltRad);
        const sinTilt = Math.sin(capTiltRad);

        // Connected width so all 11 GIFs form a continuous collar around the circumference
        const itemBaseWidth =
          gifRingItems[0].el.offsetWidth ||
          Math.min(Math.max(vw * 0.126, 96), 178);
        const arcStepRad = (Math.PI * 2) / TOTAL_RING_GIFS;
        const arcLengthPerGif = rawRadiusX * arcStepRad;
        const connectedWidthFactor = Math.max(
          1.2,
          (arcLengthPerGif * 1.12) / Math.max(1, itemBaseWidth),
        );

        // Total angular distance the leading GIF (1.gif) travels from the right edge of the screen
        // onto the right tangent of the ring (angle = 0) and then sequentially 360deg around the apple
        const entryTailDistancePx = vw * 0.65;
        const entryTailRadians = entryTailDistancePx / Math.max(1, rawRadiusX);
        const totalFeedAngle =
          Math.PI * 2 - arcStepRad * 0.35 + entryTailRadians;
        const headFeedAngle =
          -entryTailRadians + ringEntryProgress * totalFeedAngle;

        // Right tangent point of the tilted ring (angle = 0) where the incoming ribbon touches the ring from the right side
        const tangentX = appleScreenOffsetX + baseRadiusX * cosTilt;
        const tangentY = appleScreenOffsetY + baseRadiusX * sinTilt;

        for (let i = 0; i < TOTAL_RING_GIFS; i++) {
          const item = gifRingItems[i];
          const el = item.el;

          if (ringEntryProgress <= 0.001 || sceneFadeOut <= 0.001) {
            el.style.opacity = "0";
            el.style.visibility = "hidden";
            continue;
          }
          el.style.visibility = "visible";

          // Sequential position along the single ribbon:
          // 1.gif (i = 0) is the head of the ribbon; 2.gif..11.gif follow directly behind it in sequence
          const ribbonAngle = headFeedAngle - i * arcStepRad;

          let finalX, finalY, sinA, cosA, wrapBlend;

          if (ribbonAngle < 0) {
            // Still approaching on the straight horizontal line from the right side toward the right tangent point (angle = 0)
            const distFromTangentPx =
              -ribbonAngle * rawRadiusX * sceneZoomInMultiplier;
            finalX = tangentX + distFromTangentPx;
            finalY = tangentY;
            cosA = 1;
            sinA = 0;
            wrapBlend = 0;
          } else {
            // Has touched the right side of the ring and is wrapping sequentially around the apple in one direction!
            // Counter-rotate the ring against the apple as the user scrolls.
            // The apple follows scrollYaw; subtracting it here makes the ring
            // rotate in the opposite direction while preserving manual drag spin.
            const clampedOrbitAngle =
              Math.min(ribbonAngle, Math.PI * 2 - i * arcStepRad) -
              scrollYaw +
              ringSpinAngle;

            cosA = Math.cos(clampedOrbitAngle);
            sinA = Math.sin(clampedOrbitAngle); // > 0 is front half of ring, < 0 is back half of ring
            wrapBlend = Math.min(1, ribbonAngle / 0.35);

            const localRingX = cosA * baseRadiusX;
            const localRingY = sinA * baseRadiusY;

            finalX =
              appleScreenOffsetX + localRingX * cosTilt - localRingY * sinTilt;
            finalY =
              appleScreenOffsetY + localRingX * sinTilt + localRingY * cosTilt;
          }

          // Cylindrical curvature across the 7 vertical slices of each GIF so each GIF itself curves like a bottle cap
          const totalBendDeg = 62 * wrapBlend;
          const sliceStepPx = (itemBaseWidth / SLICES_PER_GIF) * 0.48;
          for (let s = 0; s < SLICES_PER_GIF; s++) {
            const normS =
              (s - (SLICES_PER_GIF - 1) / 2) / ((SLICES_PER_GIF - 1) / 2); // -1 to +1 across the GIF width
            const sliceRotY = normS * (totalBendDeg * 0.5);
            // Parabolic Z-arch so the center of each GIF bulges outward along the circular ring perimeter
            const sliceArchZ =
              (1 - normS * normS) * 19 * wrapBlend * (sinA >= 0 ? 1 : -1);
            item.slices[s].style.transform =
              `translateZ(${sliceArchZ.toFixed(2)}px) rotateY(${sliceRotY.toFixed(2)}deg) translateX(${(normS * sliceStepPx * 0.02).toFixed(2)}px)`;
          }

          // Tangent orientation of the whole GIF around the bottle-cap wall
          const cylinderWallRotY = cosA * 56 * wrapBlend;
          const wideConnectedScaleX =
            connectedWidthFactor * (1 + 0.12 * Math.abs(cosA) * wrapBlend);
          const depthScale =
            (0.92 + 0.16 * (sinA * wrapBlend)) * sceneZoomInMultiplier;

          // Layer switching: front half of bottle cap vs back half
          const shouldBeInFront = wrapBlend < 0.15 || sinA >= 0;
          if (shouldBeInFront !== item.inFront) {
            item.inFront = shouldBeInFront;
            if (shouldBeInFront) {
              gifRingFront.appendChild(el);
            } else {
              gifRingBack.appendChild(el);
            }
          }

          // Hide back-half GIFs ONLY while they pass directly behind the apple's actual silhouette
          let behindAppleMask = 1.0;
          if (!shouldBeInFront && wrapBlend > 0.3) {
            const distFromAppleCenter = Math.hypot(
              finalX - appleScreenOffsetX,
              (finalY - appleScreenOffsetY) * 0.9,
            );
            const innerHideEdge = currentApplePixelRadius * 0.78;
            const outerShowEdge = currentApplePixelRadius * 1.02;
            if (distFromAppleCenter <= innerHideEdge) {
              behindAppleMask = 0.0;
            } else if (distFromAppleCenter < outerShowEdge) {
              behindAppleMask =
                (distFromAppleCenter - innerHideEdge) /
                (outerShowEdge - innerHideEdge);
            }
          }

          const itemOpacity =
            Math.min(1, ringEntryProgress * 7) * behindAppleMask * sceneFadeOut;

          el.style.opacity = itemOpacity.toFixed(3);
          el.style.transform = `translate3d(calc(-50% + ${finalX.toFixed(1)}px), calc(-50% + ${finalY.toFixed(1)}px), ${(sinA * 54 * wrapBlend).toFixed(1)}px) rotateZ(${(capTiltDeg * wrapBlend).toFixed(1)}deg) rotateY(${cylinderWallRotY.toFixed(1)}deg) scale(${(depthScale * wideConnectedScaleX).toFixed(3)}, ${depthScale.toFixed(3)})`;
        }
      }

      function resizeAppleSlide() {
        const aw = slide4Sticky.clientWidth || window.innerWidth;
        const ah = slide4Sticky.clientHeight || window.innerHeight;
        appleRenderer.setSize(aw, ah, false);
        appleCamera.aspect = aw / ah;
        appleCamera.updateProjectionMatrix();
        targetAppleProgress = computeSlide4ScrollProgress();
      }
      window.addEventListener("resize", resizeAppleSlide);

      const appleClock = new THREE.Clock();
      function animateAppleSlide() {
        requestAnimationFrame(animateAppleSlide);
        const dt = Math.min(0.05, appleClock.getDelta());
        const t = appleClock.elapsedTime;
        if (!document.hidden && slide4InView) {
          smoothAppleProgress +=
            (targetAppleProgress - smoothAppleProgress) * 0.12;
          updateSlide4Animation(smoothAppleProgress, t, dt);
          appleRenderer.render(appleScene, appleCamera);
        }
      }
      animateAppleSlide();
      resizeAppleSlide();
    </script>
    <script>
      // Enter fullscreen on the first user interaction where the browser allows it.
      // Fullscreen must be initiated by a user gesture; unsupported browsers (notably
      // iPhone/iPad Safari for ordinary webpages) safely continue without an error.
      (() => {
        let fullscreenAttempted = false;

        function enterFullscreenOnFirstInteraction() {
          if (fullscreenAttempted || document.fullscreenElement) return;

          const page = document.documentElement;
          const request =
            page.requestFullscreen ||
            page.webkitRequestFullscreen ||
            page.mozRequestFullScreen ||
            page.msRequestFullscreen;

          if (typeof request !== "function") return;
          fullscreenAttempted = true;

          try {
            const result = request.call(page);
            if (result && typeof result.catch === "function") {
              result.catch(() => {
                // Keep the site usable if fullscreen is blocked or unavailable.
              });
            }
          } catch (_) {
            // Fullscreen is optional; never interrupt the site's interactions.
          }
        }

        document.addEventListener(
          "pointerdown",
          enterFullscreenOnFirstInteraction,
          { capture: true, passive: true }
        );
        document.addEventListener(
          "click",
          enterFullscreenOnFirstInteraction,
          { capture: true, passive: true }
        );
      })();
    </script>
  </body>
</html>
